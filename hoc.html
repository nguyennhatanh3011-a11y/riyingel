/* 8. TRÌNH PHÁT TƯƠNG TÁC: mốc dừng câu hỏi + chặn tua tới                    */
/* ========================================================================== */
const Player = (() => {
  const el = {};
  const RATES = [1, 1.25, 1.5, 0.75];
  const mediaOverride = {};      // lessonId → Blob URL (file giáo viên chọn từ máy để dùng thử)
  const demoCache = {};

  let lesson = null;
  let adapter = null;
  let completedCheckpoints = new Set();   // các mốc đã trả lời đúng: không hỏi lại
  let maxWatchedTime = 0;                 // vị trí xa nhất học viên đã xem
  let lastTime = 0;
  let duration = 0;
  let ready = false;
  let locked = false;                     // đang mở câu hỏi: khóa thanh điều khiển
  let activeCheckpoint = null;
  let overlaySolved = false;
  let wrongPicks = new Set();
  let atEnd = false;
  let rate = 1;
  let muted = false;
  let mediaKind = 'video';
  let message = null;
  let raf = 0;
  let lastSave = 0;
  let lastPlaying = null;
  let dragging = false;
  let lockFlash = 0;
  let ytApiPromise = null;

  /* ---------- Nhận diện nguồn phát từ đường dẫn ---------- */
  function parseYouTubeId(url) {
    const m = String(url || '').match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function demoMedia(key) {
    if (demoCache[key]) return demoCache[key];
    const item = window.DEMO_MEDIA && window.DEMO_MEDIA[key];
    if (!item) return null;
    const binary = atob(item.data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    demoCache[key] = { url: URL.createObjectURL(new Blob([bytes], { type: item.type })), type: item.type };
    return demoCache[key];
  }
  // Trả về { kind: 'youtube' | 'video' | 'audio' | 'auto' | 'none', src | id }
  function resolveMedia(rawUrl) {
    const url = String(rawUrl || '').trim();
    if (!url) return { kind: 'none' };
    const youtubeId = parseYouTubeId(url);
    if (youtubeId) return { kind: 'youtube', id: youtubeId };
    if (url.startsWith('demo:')) {
      const demo = demoMedia(url.slice(5));
      if (!demo) return { kind: 'none' };
      return { kind: demo.type.startsWith('audio') ? 'audio' : 'video', src: demo.url };
    }
    if (/^data:audio\//i.test(url)) return { kind: 'audio', src: url };
    if (/^data:video\//i.test(url)) return { kind: 'video', src: url };
    const path = url.split(/[?#]/)[0].toLowerCase();
    if (/\.(mp3|wav|m4a|aac|ogg|oga|opus|flac)$/.test(path)) return { kind: 'audio', src: url };
    if (/\.(mp4|m4v|webm|ogv|mov)$/.test(path)) return { kind: 'video', src: url };
    return { kind: 'auto', src: url };   // blob: và đường dẫn không có đuôi → tự nhận diện sau khi đọc được metadata
  }

  /* ---------- Trạng thái chung ---------- */
  const progress = () => LP(lesson.id);
  const free = () => isTeacher() || !!(lesson && progress().ended);
  const nextCheckpoint = () => (lesson ? lesson.checkpoints.find((cp) => !completedCheckpoints.has(cp.id)) || null : null);
  function seekLimit() {
    if (free()) return duration || 0;
    const next = nextCheckpoint();
    return next ? Math.min(maxWatchedTime, next.time) : maxWatchedTime;
  }
  function setLocked(value) {
    locked = value;
    if (value) el.controls.setAttribute('aria-disabled', 'true');
    else el.controls.removeAttribute('aria-disabled');
    el.stageHit.disabled = value;
  }
  function setWaiting(value) { el.stageWait.hidden = !value; }
  function showMessage(text, canRetry) {
    message = text || null;
    el.stageMsg.hidden = !message;
    el.stageMsg.innerHTML = message
      ? `${icon('alert', 'size-8 text-amber-300')}<p class="text-sm text-white/85">${esc(message)}</p>${canRetry ? `<button type="button" data-retry class="h-9 px-4 rounded-lg bg-white/10 hover:bg-white/20 text-sm font-medium inline-flex items-center gap-2">${icon('refresh')}Tải lại</button>` : ''}`
      : '';
    if (message) setWaiting(false);
  }
  function flashSeekLock() {
    el.seekLock.hidden = false;
    clearTimeout(lockFlash);
    lockFlash = setTimeout(() => { el.seekLock.hidden = true; }, 900);
  }
  function showAudioStage() {
    const chars = Array.from(String(lesson.cover || '')).slice(0, 4);
    el.audioCover.innerHTML = chars.length
      ? chars.map((c) => `<span class="tian tian-dark w-16 sm:w-20 text-4xl sm:text-5xl" lang="${esc(lesson.lang)}">${esc(c)}</span>`).join('')
      : `<span class="size-20 grid place-items-center rounded-3xl bg-white/10">${icon('headphones', 'size-9')}</span>`;
    el.media.hidden = true;
    el.audioStage.hidden = false;
  }

  /* ---------- Nguồn phát HTML5 (<video> phát được cả mp4 lẫn mp3 / wav / blob) ---------- */
  function createHtml5Adapter(src) {
    const v = el.media;
    const ac = new AbortController();
    const on = (name, fn) => v.addEventListener(name, fn, { signal: ac.signal });
    on('loadedmetadata', () => {
      duration = Number.isFinite(v.duration) ? v.duration : 0;
      if (mediaKind !== 'audio' && v.videoWidth === 0) { mediaKind = 'audio'; showAudioStage(); }
      onReady();
    });
    on('durationchange', () => {
      if (Number.isFinite(v.duration) && v.duration !== duration) { duration = v.duration; applyAutoCheckpoints(); renderMarks(); updateUI(); }
    });
    on('timeupdate', tick);
    on('seeking', () => {
      // Chặn tua tới: nếu vị trí mới vượt quá maxWatchedTime (hoặc mốc câu hỏi chưa trả lời) thì trả về ngay.
      const limit = seekLimit();
      if (v.currentTime > limit + 0.01) {
        v.currentTime = limit;
        lastTime = limit;
        flashSeekLock();
      } else {
        lastTime = v.currentTime;
      }
    });
    on('play', () => { if (locked) { v.pause(); return; } onPlayState(); });   // đang mở câu hỏi thì không cho phát
    on('pause', () => { saveWatched(); onPlayState(); });
    on('seeked', tick);
    on('playing', () => setWaiting(false));
    on('canplay', () => setWaiting(false));
    on('waiting', () => { if (!v.paused) setWaiting(true); });
    on('ended', onEnded);
    on('ratechange', () => { if (v.playbackRate !== rate) v.playbackRate = rate; });
    on('error', () => { ready = false; showMessage('Không tải được video của bài này', true); updateUI(); });
    v.muted = muted;
    v.src = src;
    v.load();
    return {
      play() { const r = v.play(); if (r && r.catch) r.catch(() => {}); },
      pause() { v.pause(); },
      time: () => v.currentTime || 0,
      seek(t) { try { v.currentTime = t; } catch (err) { /* chưa sẵn sàng */ } },
      paused: () => v.paused,
      setRate(r) { v.playbackRate = r; },
      setMuted(m) { v.muted = m; },
      destroy() { ac.abort(); v.pause(); v.removeAttribute('src'); v.load(); }
    };
  }

  /* ---------- Nguồn phát YouTube (IFrame API) ---------- */
  function loadYouTubeApi() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (ytApiPromise) return ytApiPromise;
    ytApiPromise = new Promise((resolve, reject) => {
      const previous = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (typeof previous === 'function') previous(); resolve(); };
      const script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      script.onerror = () => { ytApiPromise = null; reject(new Error('youtube-api')); };
      document.head.appendChild(script);
      setTimeout(() => { if (!(window.YT && window.YT.Player)) { ytApiPromise = null; reject(new Error('youtube-timeout')); } }, 15000);
    });
    return ytApiPromise;
  }
  function createYouTubeAdapter(videoId) {
    let yt = null;
    let alive = true;
    let poll = 0;
    let state = -1;
    el.ytHolder.innerHTML = '<div id="yt-frame"></div>';
    setWaiting(true);
    loadYouTubeApi().then(() => {
      if (!alive) return;
      const playerVars = { controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3 };
      if (/^https?:/.test(location.origin)) playerVars.origin = location.origin;
      yt = new window.YT.Player('yt-frame', {
        width: '100%',
        height: '100%',
        videoId,
        playerVars,
        events: {
          onReady: () => {
            if (!alive) return;
            duration = yt.getDuration() || 0;
            onReady();
            poll = setInterval(() => {
              if (!duration) { duration = yt.getDuration() || 0; if (duration) { applyAutoCheckpoints(); renderMarks(); } }
              tick();
            }, 200);
          },
          onStateChange: (event) => {
            if (!alive) return;
            state = event.data;
            if (state === 1) { setWaiting(false); el.stageHit.hidden = false; }
            if (state === 3) setWaiting(true);
            if (state === 0) onEnded();
            if (state === 2) saveWatched();
            onPlayState();
          },
          onError: () => { if (alive) { ready = false; showMessage('Không phát được video YouTube này', true); } }
        }
      });
    }).catch(() => { if (alive) showMessage('Không tải được YouTube', true); });
    return {
      play() {
        if (!yt || !yt.playVideo) return;
        yt.playVideo();
        // Một số điện thoại chỉ cho phát khi chạm trực tiếp vào khung YouTube: tạm gỡ lớp phủ để học viên chạm.
        setTimeout(() => { if (alive && state !== 1 && state !== 3 && !locked) el.stageHit.hidden = true; }, 1500);
      },
      pause() { if (yt && yt.pauseVideo) yt.pauseVideo(); },
      time: () => (yt && yt.getCurrentTime ? yt.getCurrentTime() || 0 : 0),
      seek(t) { if (yt && yt.seekTo) yt.seekTo(t, true); },
      paused: () => state !== 1 && state !== 3,
      setRate(r) { if (yt && yt.setPlaybackRate) yt.setPlaybackRate(r); },
      setMuted(m) { if (yt && yt.mute) { if (m) yt.mute(); else yt.unMute(); } },
      destroy() {
        alive = false;
        clearInterval(poll);
        try { if (yt && yt.destroy) yt.destroy(); } catch (err) { /* bỏ qua */ }
        el.ytHolder.innerHTML = '';
        el.stageHit.hidden = false;
      }
    };
  }

  /* ---------- Vòng đời ---------- */
  function destroy() {
    cancelAnimationFrame(raf);
    if (lesson && ready) { progress().maxT = Math.max(progress().maxT || 0, maxWatchedTime); persist(); }
    if (adapter) adapter.destroy();
    adapter = null;
    ready = false;
    closeOverlay();
    setLocked(false);
    if (fsElement()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (err) { /* bỏ qua */ } }
  }
  function load(nextLesson) {
    destroy();
    lesson = nextLesson;
    const p = progress();
    completedCheckpoints = new Set(p.cps);
    maxWatchedTime = p.maxT || 0;
    lastTime = 0;
    duration = 0;
    atEnd = false;
    lastPlaying = null;
    showMessage(null);
    setWaiting(false);
    el.media.hidden = true;
    el.ytWrap.hidden = true;
    el.audioStage.hidden = true;
    const source = resolveMedia(mediaOverride[lesson.id] || lesson.videoUrl);
    mediaKind = source.kind;
    if (source.kind === 'none') {
      showMessage('Bài này chưa có video');
      if (!lesson.checkpoints.length && !p.ended) { p.ended = true; persist(); }
    } else if (source.kind === 'youtube') {
      el.ytWrap.hidden = false;
      adapter = createYouTubeAdapter(source.id);
    } else {
      if (source.kind === 'audio') showAudioStage(); else el.media.hidden = false;
      setWaiting(true);
      adapter = createHtml5Adapter(source.src);
    }
    renderMarks();
    updateUI();
  }
  // Bài có mốc "auto": khi biết độ dài video thì chia đều các mốc.
  function applyAutoCheckpoints() {
    if (!lesson || !assignAutoCheckpoints(lesson, duration)) return;
    renderMarks();
    if (ui.view === 'app' && ui.lessonId === lesson.id && ui.tab === 'video') App.renderPanel();
  }
  function onReady() {
    ready = true;
    setWaiting(false);
    applyAutoCheckpoints();
    const p = progress();
    maxWatchedTime = duration ? Math.min(p.maxT || 0, duration) : (p.maxT || 0);
    adapter.setRate(rate);
    adapter.setMuted(muted);
    if (!p.ended && maxWatchedTime > 0.5) {
      const resume = Math.max(0, Math.min(maxWatchedTime, (duration || maxWatchedTime) - 0.3));
      lastTime = resume;
      adapter.seek(resume);
    }
    renderMarks();
    updateUI();
  }

  /* ---------- Nhịp kiểm tra: chặn tua tới + dừng tại mốc ---------- */
  function tick() {
    if (!adapter || !ready || !lesson) return;
    let t = adapter.time();
    if (!locked) {
      if (t > maxWatchedTime) {
        const step = t - lastTime;
        const natural = step >= 0 && step <= 1.25 * rate + 0.5;   // phát bình thường, không phải nhảy cóc
        if (free() || natural) {
          maxWatchedTime = t;
        } else {
          t = maxWatchedTime;
          adapter.seek(t);
          flashSeekLock();
        }
      }
      lastTime = t;
      const cp = nextCheckpoint();
      if (cp && t >= cp.time) openCheckpoint(cp);
    }
    const now = Date.now();
    if (now - lastSave > 1500) {
      lastSave = now;
      const p = progress();
      if (maxWatchedTime > (p.maxT || 0)) { p.maxT = maxWatchedTime; persist(); }
    }
    updateUI();
  }
  function saveWatched() {
    if (!lesson) return;
    const p = progress();
    if (maxWatchedTime > (p.maxT || 0)) { p.maxT = maxWatchedTime; persist(); }
  }
  function onPlayState() {
    updateUI();
    cancelAnimationFrame(raf);
    const step = () => {
      if (adapter && ready && !adapter.paused()) {
        tick();
        raf = requestAnimationFrame(step);
      }
    };
    raf = requestAnimationFrame(step);
  }
  function onEnded() {
    if (!lesson) return;
    const cp = nextCheckpoint();
    if (cp) {   // mốc đặt quá cuối video: hỏi nốt trước khi tính là xem xong
      atEnd = true;
      openCheckpoint(cp);
      return;
    }
    atEnd = false;
    const p = progress();
    maxWatchedTime = Math.max(maxWatchedTime, duration || 0);
    p.maxT = maxWatchedTime;
    const first = !p.ended;
    p.ended = true;
    persist();
    updateUI();
    if (first) App.progressChanged(lesson.id, { videoJustEnded: true });
  }

  /* ---------- Câu hỏi tại mốc dừng ---------- */
  function openCheckpoint(cp) {
    if (activeCheckpoint === cp) return;
    activeCheckpoint = cp;
    overlaySolved = false;
    wrongPicks = new Set();
    adapter.pause();
    setLocked(true);
    saveWatched();   // tải lại trang giữa chừng vẫn quay về đúng câu hỏi này
    Sound.stop();
    App.setTab('video');
    renderOverlay();
    el.cpOverlay.hidden = false;
    updateUI();
    const first = el.cpOverlay.querySelector('button[data-cp="pick"]');
    if (first) first.focus({ preventScroll: true });
    if (window.matchMedia('(max-width: 1023px)').matches) el.player.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function closeOverlay() {
    activeCheckpoint = null;
    overlaySolved = false;
    if (el.cpOverlay) {
      el.cpOverlay.hidden = true;
      el.cpOverlay.innerHTML = '';
    }
  }
  function renderOverlay() {
    const cp = activeCheckpoint;
    const index = lesson.checkpoints.indexOf(cp);
    const options = cp.options.map((option, i) => {
      const right = overlaySolved && i === cp.correct;
      const wrong = wrongPicks.has(i);
      const tone = right ? 'border-emerald-500 bg-emerald-50 text-emerald-700'
        : wrong ? 'border-rose-200 bg-rose-50 text-rose-600'
        : overlaySolved ? 'border-line text-ink-3'
        : 'border-line hover:border-brand hover:bg-brand-soft';
      const badge = right ? 'bg-emerald-500 text-white' : wrong ? 'bg-rose-500 text-white' : 'bg-paper text-ink-2';
      return `<button type="button" data-cp="pick" data-i="${i}" ${overlaySolved || wrong ? 'disabled' : ''} class="min-h-11 px-3 py-2 rounded-xl border text-left text-sm font-medium flex items-center gap-2.5 transition-colors ${tone}">
        <span class="size-6 shrink-0 grid place-items-center rounded-full text-xs font-semibold ${badge}">${right ? icon('check', 'size-3.5') : wrong ? icon('x', 'size-3.5') : String.fromCharCode(65 + i)}</span>
        <span class="min-w-0" lang="${esc(lesson.lang)}">${esc(option)}</span>
      </button>`;
    }).join('');
    const feedback = overlaySolved
      ? `<span class="inline-flex items-center gap-1 text-emerald-600">${icon('circle-check', 'size-4')}Chính xác</span>`
      : '';
    const retry = wrongPicks.size && !overlaySolved
      ? `<div class="mt-3 flex flex-wrap items-center gap-2" role="alert">
          <p class="flex-1 min-w-40 flex items-start gap-2 text-sm text-rose-600">${icon('bulb', 'size-4 mt-0.5')}<span>${esc(cp.hint || 'Chưa đúng, chọn lại nhé.')}</span></p>
          <button type="button" data-cp="rewatch" class="h-9 px-3 rounded-lg border border-line text-sm font-medium text-ink-2 inline-flex items-center gap-1.5 hover:border-brand hover:text-brand">${icon('rotate-ccw')}Xem lại ${SETTINGS.rewindSeconds}s</button>
        </div>`
      : '';
    el.cpOverlay.innerHTML = `<div class="w-full max-w-xl lg:max-h-full lg:overflow-y-auto scroll-thin bg-surface text-ink rounded-2xl p-4 sm:p-5 shadow-2xl animate-rise" role="dialog" aria-modal="true" aria-labelledby="cp-question">
      <div class="flex items-center gap-2 text-xs font-semibold text-ink-2">
        <span class="inline-flex items-center gap-1 h-6 px-2 rounded-full bg-brand-soft text-brand tabular-nums">${icon('flag', 'size-3.5')}${fmtTime(cp.time)}</span>
        <span class="tabular-nums">${index + 1}/${lesson.checkpoints.length}</span>
        <span class="flex-1"></span>${feedback}
      </div>
      <h2 id="cp-question" class="mt-3 text-base sm:text-lg font-semibold leading-snug" lang="${esc(lesson.lang)}">${esc(cp.question)}</h2>
      <div class="mt-3 grid gap-2 sm:grid-cols-2">${options}</div>${retry}
    </div>`;
  }
  function onOverlayClick(event) {
    const button = event.target.closest('[data-cp]');
    if (!button || !activeCheckpoint) return;
    if (button.dataset.cp === 'rewatch') { rewatch(); return; }
    if (overlaySolved) return;
    const cp = activeCheckpoint;
    const picked = Number(button.dataset.i);
    if (picked === cp.correct) {
      overlaySolved = true;
      completedCheckpoints.add(cp.id);
      progress().cps = Array.from(completedCheckpoints);
      persist();
      renderOverlay();
      renderMarks();
      App.progressChanged(lesson.id);
      const owner = lesson;
      setTimeout(() => {
        if (activeCheckpoint !== cp || lesson !== owner) return;
        closeOverlay();
        setLocked(false);
        if (atEnd) onEnded(); else adapter.play();   // đúng → tự phát tiếp
        updateUI();
      }, 850);
    } else {
      wrongPicks.add(picked);
      renderOverlay();
      const card = el.cpOverlay.firstElementChild;
      if (card) { card.classList.remove('animate-rise'); card.classList.add('animate-shake'); }
      const next = el.cpOverlay.querySelector('button[data-cp="pick"]:not(:disabled)');
      if (next) next.focus({ preventScroll: true });
    }
  }
  function rewatch() {
    const cp = activeCheckpoint;
    if (!cp) return;
    const anchor = atEnd ? (duration || cp.time) : cp.time;
    closeOverlay();
    setLocked(false);
    atEnd = false;
    const target = Math.max(0, Math.min(anchor, duration || anchor) - SETTINGS.rewindSeconds);
    lastTime = target;
    adapter.seek(target);
    adapter.play();
    updateUI();
  }

  /* ---------- Điều khiển ---------- */
  function seekTo(time) {
    if (!adapter || !ready || locked) return;
    const limit = seekLimit();
    let target = clamp(time, 0, duration || 0);
    if (target > limit) {
      target = limit;
      flashSeekLock();
    }
    lastTime = target;
    adapter.seek(target);
    updateUI(target);
  }
  function toggle() {
    if (!adapter || !ready || locked) return;
    if (adapter.paused()) {
      Sound.stop();
      Voice.cancel();
      adapter.play();
    } else {
      adapter.pause();
    }
  }
  function pause() {
    if (adapter && ready && !adapter.paused()) adapter.pause();
  }
  function cycleRate() {
    rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
    if (adapter && ready) adapter.setRate(rate);
    el.btnRate.textContent = rate + 'x';
  }
  function toggleMute() {
    muted = !muted;
    if (adapter && ready) adapter.setMuted(muted);
    renderMute();
  }
  function renderMute() {
    el.btnMute.innerHTML = icon(muted ? 'mute' : 'volume', 'size-[18px]');
    el.btnMute.setAttribute('aria-label', muted ? 'Bật tiếng' : 'Tắt tiếng');
  }
  // Toàn màn hình: chuẩn mới, bản có tiền tố webkit (iPad / Safari cũ), và trình phát video riêng của iPhone.
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  function toggleFullscreen() {
    if (fsElement()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const p = el.player;
    if (p.requestFullscreen) { p.requestFullscreen().catch(() => {}); return; }
    if (p.webkitRequestFullscreen) { p.webkitRequestFullscreen(); return; }
    if (!el.media.hidden && el.media.webkitEnterFullscreen) { try { el.media.webkitEnterFullscreen(); } catch (err) { /* bỏ qua */ } }
  }
  function seekFromPointer(event) {
    const rect = el.seek.getBoundingClientRect();
    if (!rect.width || !duration) return;
    seekTo(clamp((event.clientX - rect.left) / rect.width, 0, 1) * duration);
  }
  function onKey(event) {
    if (ui.view !== 'app' || !lesson || locked || !$('#modal').hidden) return;
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    const target = event.target;
    if (target && target.closest && target.closest('input, textarea, select, button, a, [contenteditable], [role="slider"]')) return;
    if (event.key === ' ' || event.key === 'k') { event.preventDefault(); toggle(); }
    else if (event.key === 'ArrowLeft') { event.preventDefault(); seekTo(adapter && ready ? adapter.time() - 5 : 0); }
    else if (event.key === 'ArrowRight') { event.preventDefault(); seekTo(adapter && ready ? adapter.time() + 5 : 0); }
  }

  /* ---------- Hiển thị ---------- */
  function renderMarks() {
    if (!lesson || !duration) { el.seekMarks.innerHTML = ''; return; }
    el.seekMarks.innerHTML = lesson.checkpoints
      .map((cp) => `<span class="seek-mark" data-done="${completedCheckpoints.has(cp.id)}" style="left:${clamp(cp.time / duration, 0, 1) * 100}%"></span>`)
      .join('');
  }
  function updateUI(forcedTime) {
    const t = typeof forcedTime === 'number' ? forcedTime : (adapter && ready ? adapter.time() : 0);
    const d = duration || 0;
    const ratio = d ? clamp(t / d, 0, 1) : 0;
    const watched = d ? clamp((free() ? d : maxWatchedTime) / d, 0, 1) : 0;
    el.seekFill.style.width = ratio * 100 + '%';
    el.seekKnob.style.left = ratio * 100 + '%';
    el.seekWatched.style.width = watched * 100 + '%';
    el.time.textContent = fmtTime(t) + ' / ' + fmtTime(d);
    el.seek.setAttribute('aria-valuemax', String(Math.round(d)));
    el.seek.setAttribute('aria-valuenow', String(Math.round(t)));
    el.seek.setAttribute('aria-valuetext', fmtTime(t));
    const playing = !!(adapter && ready && !adapter.paused());
    if (playing !== lastPlaying) {
      lastPlaying = playing;
      el.btnPlay.innerHTML = icon(playing ? 'pause' : 'play', 'size-5');
      el.btnPlay.setAttribute('aria-label', playing ? 'Tạm dừng' : 'Phát');
      el.audioEq.dataset.on = String(playing);
    }
    el.bigPlay.hidden = playing || locked || !ready || !!message;
  }

  function init() {
    const ids = ['player', 'stage', 'media', 'yt-wrap', 'yt-holder', 'audio-stage', 'audio-cover', 'audio-eq', 'stage-hit', 'big-play', 'stage-wait', 'stage-msg',
      'cp-overlay', 'controls', 'btn-play', 'btn-back', 'time', 'seek', 'seek-watched', 'seek-fill', 'seek-marks', 'seek-knob', 'seek-lock', 'btn-rate', 'btn-mute', 'btn-full'];
    ids.forEach((id) => { el[id.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = document.getElementById(id); });
    el.btnPlay.addEventListener('click', toggle);
    el.stageHit.addEventListener('click', toggle);
    el.btnBack.addEventListener('click', () => seekTo((adapter && ready ? adapter.time() : 0) - SETTINGS.rewindSeconds));
    el.btnRate.addEventListener('click', cycleRate);
    el.btnMute.addEventListener('click', toggleMute);
    el.btnFull.addEventListener('click', toggleFullscreen);
    el.btnBack.setAttribute('aria-label', `Lùi ${SETTINGS.rewindSeconds} giây`);
    el.btnBack.title = `Lùi ${SETTINGS.rewindSeconds} giây`;
    el.cpOverlay.addEventListener('click', onOverlayClick);
    el.stageMsg.addEventListener('click', (event) => { if (event.target.closest('[data-retry]') && lesson) load(lesson); });
    el.seek.addEventListener('pointerdown', (event) => {
      if (locked || !ready) return;
      dragging = true;
      try { el.seek.setPointerCapture(event.pointerId); } catch (err) { /* bỏ qua */ }
      seekFromPointer(event);
    });
    el.seek.addEventListener('pointermove', (event) => { if (dragging) seekFromPointer(event); });
    const endDrag = () => { dragging = false; };
    el.seek.addEventListener('pointerup', endDrag);
    el.seek.addEventListener('pointercancel', endDrag);
    el.seek.addEventListener('keydown', (event) => {
      if (!adapter || !ready) return;
      const step = event.key === 'ArrowLeft' ? -5 : event.key === 'ArrowRight' ? 5 : 0;
      if (!step) return;
      event.preventDefault();
      seekTo(adapter.time() + step);
    });
    document.addEventListener('keydown', onKey);
    const onFs = () => {
      const on = fsElement() === el.player;
      el.btnFull.innerHTML = icon(on ? 'minimize' : 'maximize', 'size-[18px]');
      el.btnFull.setAttribute('aria-label', on ? 'Thoát toàn màn hình' : 'Toàn màn hình');
    };
    document.addEventListener('fullscreenchange', onFs);
    document.addEventListener('webkitfullscreenchange', onFs);
    if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled && !el.media.webkitEnterFullscreen) el.btnFull.hidden = true;
    renderMute();
  }

  return {
    init,
    load,
    pause,
    destroy,
    resolveMedia,
    parseYouTubeId,
    loadYouTubeApi,
    setMini(value) { el.player.dataset.mini = String(!!value); },
    setOverride(lessonId, url) { if (url) mediaOverride[lessonId] = url; else delete mediaOverride[lessonId]; },
    refresh() { renderMarks(); updateUI(); },
    isLocked: () => locked
  };
})();

/* 9. TÀI KHOẢN HỌC VIÊN (email + mật khẩu) VÀ LƯU TIẾN TRÌNH                  */
/* ========================================================================== */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const cleanEmail = (value) => String(value ?? '').trim().toLowerCase();
function endOfDate(dateText) {
  if (!dateText) return null;
  const m = String(dateText).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  const end = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 23, 59, 59) : new Date(dateText);
  return Number.isFinite(end.getTime()) ? end : null;
}
function isExpired(dateText) {
  const end = endOfDate(dateText);
  return !!end && Date.now() > end.getTime();
}
function daysLeft(dateText) {
  const end = endOfDate(dateText);
  return end ? Math.ceil((end.getTime() - Date.now()) / 86400000) : null;
}

// Máy chủ thử chạy ngay trong trình duyệt khi chưa dán api.url: cùng giao thức với Code.gs,
// nhưng tài khoản chỉ nằm trên máy này. Dùng để xem thử, không dùng để bán.
const LocalBackend = {
  KEY: 'riying-elearning:accounts',
  db: null,
  read() {
    if (this.db) return this.db;
    try { this.db = JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (err) { this.db = {}; }
    return this.db;
  },
  write() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.db)); } catch (err) { /* vẫn giữ trong bộ nhớ của phiên này */ }
  },
  // Băm gọn cho chế độ thử. Khi chạy thật, mật khẩu được băm kèm muối trên máy chủ (Code.gs).
  digest(text) {
    let h1 = 0xdeadbeef;
    let h2 = 0x41c6ce57;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 2654435761);
      h2 = Math.imul(h2 ^ c, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  },
  accounts() {
    const db = this.read();
    (APP_CONFIG.demoAccounts || []).forEach((demo) => {
      const email = cleanEmail(demo.email);
      if (!email) return;
      const base = db[email] || { email, name: demo.name || '', pass: this.digest(String(demo.password || '')), tokens: [] };
      db[email] = Object.assign(base, { active: demo.active !== false, plan: demo.plan || '', maxLessons: demo.maxLessons || 0, expiresAt: demo.expiresAt || '', role: demo.role || '' });
    });
    return db;
  },
  student(account) {
    const expired = isExpired(account.expiresAt);
    return {
      email: account.email,
      name: account.name || '',
      plan: account.plan || '',
      active: !!account.active && !expired,
      expired,
      maxLessons: account.maxLessons || 0,
      expiresAt: account.expiresAt || '',
      role: account.role === 'teacher' ? 'teacher' : 'student'
    };
  },
  handle(request) {
    const db = this.accounts();
    const email = cleanEmail(request.email);
    const account = db[email];
    const signedIn = () => !!account && (account.tokens || []).includes(request.token);
    const signIn = (target) => {
      const token = uid() + uid();
      target.tokens = (target.tokens || []).concat(token).slice(-2);
      this.write();
      return { ok: true, token, student: this.student(target), state: null };
    };
    switch (request.action) {
      case 'register':
        if (String(request.name || '').trim().length < 2) return { ok: false, reason: 'name' };
        if (!EMAIL_RE.test(email)) return { ok: false, reason: 'email' };
        if (String(request.password || '').length < 6) return { ok: false, reason: 'password' };
        if (account) return { ok: false, reason: 'exists' };
        db[email] = { email, name: String(request.name).trim(), pass: this.digest(String(request.password)), active: false, plan: '', maxLessons: 0, expiresAt: '', role: '', tokens: [] };
        return signIn(db[email]);
      case 'login':
        if (!account || account.pass !== this.digest(String(request.password || ''))) return { ok: false, reason: 'invalid' };
        return signIn(account);
      case 'me':
        return signedIn() ? { ok: true, student: this.student(account), state: null } : { ok: false, reason: 'session' };
      case 'save':
        return signedIn() ? { ok: true } : { ok: false, reason: 'session' };
      case 'password':
        if (!signedIn()) return { ok: false, reason: 'session' };
        if (account.pass !== this.digest(String(request.oldPassword || ''))) return { ok: false, reason: 'invalid' };
        if (String(request.newPassword || '').length < 6) return { ok: false, reason: 'password' };
        account.pass = this.digest(String(request.newPassword));
        account.tokens = [request.token];
        this.write();
        return { ok: true };
      default:
        return { ok: false, reason: 'unknown' };
    }
  }
};

const Api = {
  remote() { return !!(APP_CONFIG.api && APP_CONFIG.api.url); },
  // Gửi JSON dạng text/plain để trình duyệt không gửi preflight (Apps Script không trả lời OPTIONS).
  async call(payload, timeoutMs = 30000) {
    if (!this.remote()) return LocalBackend.handle(payload);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(APP_CONFIG.api.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow',
        signal: controller.signal
      });
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }
};

const Account = {
  messages: {
    name: 'Nhập họ tên',
    email: 'Email chưa đúng',
    password: 'Mật khẩu cần ít nhất 6 ký tự',
    exists: 'Email này đã có tài khoản',
    invalid: 'Sai email hoặc mật khẩu',
    locked: 'Nhập sai quá nhiều lần. Đợi 10 phút rồi thử lại',
    busy: 'Hệ thống đang bận, thử lại sau ít phút',
    session: 'Tài khoản vừa đăng nhập trên thiết bị khác. Đăng nhập lại để học tiếp',
    network: 'Không kết nối được máy chủ'
  },
  message(reason) { return this.messages[reason] || this.messages[reason === 'error' ? 'busy' : 'network']; },
  async once(payload) {
    try {
      const result = await Api.call(payload);
      return result && typeof result === 'object' ? result : { ok: false, reason: 'network' };
    } catch (err) {
      return { ok: false, reason: 'network' };
    }
  },
  // Máy chủ bận hoặc mất mạng chốc lát (nhiều người vào cùng lúc): tự thử lại 2 lần trước khi báo lỗi.
  async request(payload) {
    const waits = payload.action === 'register' ? [] : [1500, 4000];
    let result = await this.once(payload);
    for (const wait of waits) {
      if (result.ok || !['network', 'busy', 'error'].includes(result.reason)) break;
      await new Promise((resolve) => setTimeout(resolve, wait + Math.random() * 1000));
      result = await this.once(payload);
    }
    return result;
  },
  // Ghi phiên đăng nhập vào máy sau khi máy chủ chấp nhận.
  apply(result) {
    store.session = Object.assign({}, result.student, { token: result.token, loginAt: Date.now() });
    persist();
    if (result.state) mergeProgress(result.state);
  },
  async register(name, email, password) {
    const result = await this.request({ action: 'register', name, email: cleanEmail(email), password });
    if (result.ok) this.apply(result);
    return result;
  },
  async login(email, password) {
    const result = await this.request({ action: 'login', email: cleanEmail(email), password, device: navigator.userAgent });
    if (result.ok) this.apply(result);
    return result;
  },
  // Hỏi lại máy chủ: tài khoản đã được kích hoạt chưa, còn hạn không, có tiến trình mới từ máy khác không.
  async refresh() {
    const session = store.session;
    if (!session) return { ok: false, reason: 'session' };
    const result = await this.request({ action: 'me', email: session.email, token: session.token });
    if (result.ok && store.session && store.session.email === session.email) {
      store.session = Object.assign({}, store.session, result.student);
      persist();
      if (result.state) mergeProgress(result.state);
    }
    return result;
  },
  changePassword(oldPassword, newPassword) {
    const session = store.session;
    return this.request({ action: 'password', email: session.email, token: session.token, oldPassword, newPassword });
  }
};

// Lưu tiến trình của học viên lên máy chủ để học tiếp trên thiết bị khác.
const Cloud = {
  status: 'ok',   // syncing | ok | error
  timer: 0,
  busy: false,
  again: false,
  dirty: false,

  enabled() { return Api.remote() && !!store.session; },
  // Chỉ gửi những bài đã có tiến trình, để dữ liệu lưu trên Sheet gọn.
  compact() {
    const up = userProgress();
    const lessons = {};
    Object.keys(up.lessons).forEach((id) => {
      const p = up.lessons[id];
      const touched = p.cps.length || p.maxT > 0 || p.ended || p.listening.length || Object.keys(p.speaking).length || p.reading.length || p.writing.length
        || Object.keys(p.review).length || p.preview.seen.length || Object.keys(p.preview.ex).length || p.tasks.length;
      if (touched) lessons[id] = p;
    });
    return { lessons, unlocked: up.unlocked, days: up.days, lastLesson: up.lastLesson, tests: up.tests || {} };
  },
  payload() {
    return { action: 'save', email: store.session.email, token: store.session.token, state: this.compact() };
  },
  schedule(delay = 1500) {
    if (!this.enabled()) return;
    this.dirty = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), delay);
  },
  async flush() {
    if (!this.enabled()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    this.setStatus('syncing');
    try {
      const result = await Api.call(this.payload());
      if (result && result.ok) {
        this.dirty = false;
        this.setStatus('ok');
      } else if (result && result.reason === 'session') {
        this.setStatus('error');
        App.sessionLost();
      } else {
        throw new Error('save');
      }
    } catch (err) {
      this.setStatus('error');
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), 10000 + Math.random() * 10000);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.schedule(300); }
    }
  },
  // Trang sắp đóng: gửi nốt bản mới nhất.
  beacon() {
    if (!this.enabled() || !this.dirty || !navigator.sendBeacon) return;
    try { navigator.sendBeacon(APP_CONFIG.api.url, JSON.stringify(this.payload())); } catch (err) { /* bỏ qua */ }
  },
  setStatus(status) {
    this.status = status;
    const badge = $('#sync-badge');
    if (!badge) return;
    badge.hidden = !this.enabled();
    const view = {
      syncing: ['loader', 'text-brand', 'Đang lưu tiến trình'],
      ok: ['cloud-up', 'text-emerald-600', 'Đã lưu tiến trình'],
      error: ['cloud-off', 'text-rose-600', 'Chưa lưu được, sẽ tự thử lại']
    }[status] || ['cloud', 'text-ink-3', ''];
    badge.className = `size-9 grid place-items-center rounded-lg ${view[1]}`;
    badge.title = view[2];
    badge.setAttribute('aria-label', view[2]);
    badge.innerHTML = icon(view[0], `size-5 ${status === 'syncing' ? 'spin' : ''}`);
  }
};

// Gộp tiến trình lưu trên máy chủ vào máy này (học tiếp trên thiết bị khác).
function mergeProgress(remote) {
  if (!remote || typeof remote !== 'object') return;
  const local = userProgress();
  const union = (a, b) => Array.from(new Set([...(a || []), ...(b || [])]));
  const mergeExercise = (a, b) => (Array.isArray(a) || Array.isArray(b) ? union(Array.isArray(a) ? a : [], Array.isArray(b) ? b : []) : (a === true || b === true));
  local.unlocked = union(local.unlocked, remote.unlocked);
  local.days = union(local.days, remote.days).sort();
  if (!local.lastLesson && remote.lastLesson) local.lastLesson = remote.lastLesson;
  Object.keys(remote.tests || {}).forEach((id) => {
    const r = remote.tests[id] || {};
    local.tests = local.tests || {};
    const l = local.tests[id];
    if (!l) { local.tests[id] = r; return; }
    const newer = String(r.at || '') > String(l.at || '');
    const src = newer ? r : l;
    local.tests[id] = { best: Math.max(Number(l.best) || 0, Number(r.best) || 0), last: src.last, n: Math.max(Number(l.n) || 0, Number(r.n) || 0), at: src.at, redo: !!src.redo, cleared: !!src.cleared,
      first: !l.first ? r.first || null : !r.first ? l.first : (String(r.first.at) < String(l.first.at) ? r.first : l.first) };
  });
  Object.keys(remote.lessons || {}).forEach((id) => {
    const r = remote.lessons[id] || {};
    const l = LP(id);
    l.cps = union(l.cps, r.cps);
    l.maxT = Math.max(l.maxT || 0, Number(r.maxT) || 0);
    l.ended = l.ended || !!r.ended;
    l.listening = union(l.listening, r.listening);
    l.reading = union(l.reading, r.reading);
    l.writing = union(l.writing, r.writing);
    l.tasks = union(l.tasks, r.tasks);
    Object.keys(r.speaking || {}).forEach((k) => {
      const a = l.speaking[k];
      const b = r.speaking[k];
      if (!b) return;
      if (!a) { l.speaking[k] = b; return; }
      l.speaking[k] = { passed: !!(a.passed || b.passed), score: Math.max(a.score || 0, b.score || 0) || (a.score ?? b.score ?? null), mode: a.passed ? a.mode : b.mode };
    });
    Object.keys(r.review || {}).forEach((k) => { l.review[k] = mergeExercise(l.review[k], r.review[k]); });
    const rp = r.preview || {};
    l.preview.seen = union(l.preview.seen, rp.seen);
    Object.keys(rp.ex || {}).forEach((k) => { l.preview.ex[k] = mergeExercise(l.preview.ex[k], rp.ex[k]); });
    l.done = l.done || !!r.done;
    l.doneAt = l.doneAt || r.doneAt || null;
  });
  persist();
}

function deckSeen(lesson, key) {
  const p = LP(lesson.id);
  if (key === 'preview:vocab') return p.preview.seen;
  const [scope, index] = key.split(':');
  const bag = scope === 'review' ? p.review : p.preview.ex;
  if (!Array.isArray(bag[index])) bag[index] = [];
  return bag[index];
}
function deckCards(lesson, key) {
  if (key === 'preview:vocab') return lesson.previewNew.vocabulary;
  const [scope, index] = key.split(':');
  const exercise = (scope === 'review' ? lesson.reviewOld.exercises : lesson.previewNew.exercises)[Number(index)];
  return (exercise && exercise.cards) || [];
}
function deckDots(cards, seen, current) {
  if (cards.length > 14) return `<span class="px-2 text-sm tabular-nums text-ink-2">${current + 1}/${cards.length}</span>`;
  return cards.map((_, i) => `<span class="block size-2 rounded-full ${seen.includes(i) ? 'bg-emerald-500' : 'bg-line'} ${i === current ? 'ring-2 ring-offset-2 ring-brand' : ''}"></span>`).join('');
}

  const cards = deckCards(lesson, key);
  if (!cards.length) return '';
  const seen = deckSeen(lesson, key);
  if (!ui.deck[key]) {
    const firstNew = cards.findIndex((_, i) => !seen.includes(i));
    ui.deck[key] = { i: firstNew < 0 ? 0 : firstNew, flipped: false };
  }
  const state = ui.deck[key];
  state.i = clamp(state.i, 0, cards.length - 1);
  const card = cards[state.i];
  const chars = Array.from(String(card.word || ''));
  const cell = chars.length <= 2 ? 'w-24 text-6xl' : chars.length === 3 ? 'w-[4.5rem] text-5xl' : 'w-14 text-3xl';

    ? chars.map((c) => `<span class="tian ${cell}">${esc(c)}</span>`).join('')
    : `<span class="hz px-3 text-3xl font-semibold text-center">${esc(card.word)}</span>`;
  const nav = 'size-10 grid place-items-center rounded-full border border-line text-ink-2 hover:border-brand hover:text-brand';
  return `<div class="flex flex-col items-center gap-3" data-deck="${key}">
    <div class="flip w-full max-w-xs h-44" data-flipped="${state.flipped}">

        <span class="flip-face flip-back grid place-items-center rounded-2xl bg-brand text-white p-4 text-center">
          <span><span class="py block text-2xl font-semibold">${esc(card.phonetic || '')}</span><span class="block mt-1.5 text-sm text-white/85">${esc(card.meaning || '')}</span></span>
        </span>
      </button>
    </div>

      <button type="button" data-action="deck-prev" data-key="${key}" aria-label="Thẻ trước" class="${nav}">${icon('chevron-left', 'size-5')}</button>
      <div class="flex items-center gap-1.5 px-1" data-deck-dots>${deckDots(cards, seen, state.i)}</div>
      <button type="button" data-action="deck-next" data-key="${key}" aria-label="Thẻ sau" class="${nav}">${icon('chevron-right', 'size-5')}</button>

function fillAnswers(exercise, b) {

  return Array.isArray(a) ? a : a == null ? [] : [a];
}
function fillBlock(lesson, scope, index, exercise, done) {
  const key = `${scope}:${index}`;
  const parts = String(exercise.text || '').split(/_{3,}/);
  const blanks = parts.length - 1;
  const state = fillState(key, blanks);
  const hasBank = Array.isArray(exercise.bank) && exercise.bank.length > 0;
  const body = parts.map((part, b) => {
    const text = `<span lang="${esc(lesson.lang)}">${esc(part)}</span>`;
    if (b >= blanks) return text;
    const value = done ? (fillAnswers(exercise, b)[0] || '') : state.values[b];
    const bad = state.bad.includes(b);
    const tone = done ? 'border-emerald-500 bg-emerald-50 text-emerald-700'
      : bad ? 'border-rose-400 bg-rose-50 text-rose-600'
      : state.active === b && hasBank ? 'border-brand bg-brand-soft text-brand'
      : 'border-line bg-surface';
    const slot = hasBank
      ? `<button type="button" data-action="fill-slot" data-scope="${scope}" data-index="${index}" data-b="${b}" ${done ? 'disabled' : ''} aria-label="Chỗ trống ${b + 1}" class="inline-flex align-middle items-center justify-center min-w-16 h-10 mx-1 px-2.5 rounded-lg border-2 font-semibold ${tone}">${value ? esc(value) : '&nbsp;'}</button>`
      : `<input type="text" data-fill="${key}" data-b="${b}" value="${esc(value)}" ${done ? 'readonly' : ''} aria-label="Chỗ trống ${b + 1}" autocomplete="off" autocapitalize="off" spellcheck="false" class="inline-block align-middle w-28 h-10 mx-1 px-2.5 rounded-lg border-2 font-semibold text-center focus:outline-none focus:border-brand ${tone}">`;
    return text + slot;
  }).join('');
  const bank = hasBank && !done
    ? `<div class="flex flex-wrap justify-center gap-2">${exercise.bank.map((word, v) => `<button type="button" data-action="fill-pick" data-scope="${scope}" data-index="${index}" data-v="${v}" class="h-10 px-3.5 rounded-xl border border-line bg-surface font-semibold shadow-sm hover:border-brand hover:text-brand" lang="${esc(lesson.lang)}">${esc(word)}</button>`).join('')}</div>`
    : '';
  const check = !hasBank && !done
    ? `<button type="button" data-action="fill-check" data-scope="${scope}" data-index="${index}" class="self-center h-10 px-4 rounded-xl bg-brand text-white text-sm font-semibold inline-flex items-center gap-1.5 hover:bg-brand-dark">${icon('check')}Kiểm tra</button>`
    : '';
  return `<div class="flex flex-col gap-4" data-fill-block="${key}">
    <p class="text-lg leading-[3rem] whitespace-pre-line">${body}</p>${bank}${check}
  </div>`;
}

/* ---------- Bài tập trong Ôn bài cũ / Xem trước bài mới ---------- */
function exerciseHtml(lesson, scope, index, exercise, saved) {
  const done = exerciseDone(exercise, saved);
  if (exercise.type === 'fill') return fillBlock(lesson, scope, index, exercise, done);
  if (exercise.type === 'flashcards') return deckHtml(lesson, `${scope}:${index}`);
  return choiceBlock({ scope, index, question: exercise.question, options: exercise.options, correct: exercise.correct, done, lang: lesson.lang });
}
function exercisePager(lesson, scope, exercises, bag) {
  if (!exercises.length) return '';
  const isDone = (i) => exerciseDone(exercises[i], bag[i]);
  const current = currentPage(scope, exercises.length, isDone);
  return `${pagerDots(scope, exercises.length, isDone, current)}${exerciseHtml(lesson, scope, current, exercises[current], bag[current])}`;
}

/* ---------- Tiến trình của tôi ---------- */
function dayKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}
function fmtDate(text) {
  const m = String(text || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? `${m[3].padStart(2, '0')}/${m[2].padStart(2, '0')}/${m[1]}` : '';
}
// Số ngày học liên tiếp tính đến hôm nay (hoặc hôm qua, nếu hôm nay chưa học).
function studyStreak(days) {
  const set = new Set(days || []);
  const cursor = new Date();
  if (!set.has(dayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  let streak = 0;
  while (set.has(dayKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}
function progressOverview() {
  const lessons = publishedLessons();   // chỉ tính các bài đã có video
  const up = userProgress();
  const stats = lessons.map((lesson) => lessonStatus(lesson));
  const doneParts = stats.reduce((n, s) => n + s.doneCount, 0);
  const scores = [];
  lessons.forEach((lesson) => Object.values(LP(lesson.id).speaking).forEach((x) => { if (x && typeof x.score === 'number') scores.push(x.score); }));
  return {
    lessons,
    stats,
    soon: APP_CONFIG.lessons.length - lessons.length,
    percent: lessons.length ? Math.round((doneParts / (lessons.length * 7)) * 100) : 0,
    doneLessons: lessons.filter((lesson) => checkLessonUnlock(lesson.id)).length,
    totalLessons: lessons.length,
    studyDays: up.days.length,
    streak: studyStreak(up.days),
    speakingAvg: scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null
  };
}
function accountStatusHtml(session) {
  const chip = (tone, text) => `<span class="inline-flex items-center h-6 px-2 rounded-full text-xs font-semibold ${tone}">${esc(text)}</span>`;
  if (session.role === 'teacher') return chip('bg-brand-soft text-brand', 'Giáo viên');
  const upgrade = (label) => `<button type="button" data-action="activate" class="h-7 px-2.5 rounded-full bg-brand text-white text-xs font-semibold inline-flex items-center gap-1 hover:bg-brand-dark">${icon('key', 'size-3.5')}${label}</button>`;
  if (session.expired) return chip('bg-rose-50 text-rose-600', session.expiresAt ? `Hết hạn ${fmtDate(session.expiresAt)}` : 'Đã hết hạn') + upgrade('Gia hạn');
  if (!session.active) return chip('bg-amber-50 text-gold', 'Chưa kích hoạt') + upgrade('Kích hoạt');
  const left = daysLeft(session.expiresAt);
  const term = session.expiresAt ? `Hạn dùng ${fmtDate(session.expiresAt)}${left != null && left >= 0 ? `, còn ${left} ngày` : ''}` : 'Không giới hạn thời gian';
  const soon = left != null && left >= 0 && left <= 7;
  return (session.plan ? chip('bg-emerald-50 text-emerald-700', session.plan) : '') + `<span class="text-xs ${soon ? 'text-rose-600 font-semibold' : 'text-ink-2'}">${esc(term)}</span>` + (hasEverything(session) ? '' : upgrade('Gia hạn'));
}
function dashboardHtml() {

  const initial = Array.from(String(session.name || session.email || '?').trim())[0].toUpperCase();
  const stat = (value, label) => `<div class="rounded-xl bg-paper px-3 py-2.5"><p class="text-xl font-bold tabular-nums leading-tight">${value}</p><p class="mt-0.5 text-xs text-ink-2">${label}</p></div>`;
  const rows = view.lessons.map((lesson, position) => {
    const st = view.stats[position];
    const index = lessonIndex(lesson.id);
    const p = LP(lesson.id);
    const access = lessonAccess(lesson);

    const scores = Object.values(p.speaking).map((x) => x && x.score).filter((x) => typeof x === 'number');

    const note = complete && p.doneAt ? `Xong ${fmtDate(String(p.doneAt).slice(0, 10))}`
      : access === 'plan' ? (session.active ? 'Ngoài gói học' : 'Cần kích hoạt')

  const field = 'h-11 w-full rounded-xl border border-line bg-paper px-3 text-sm focus:bg-surface focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand/15';

  const ghost = 'h-9 px-3 rounded-lg border border-line text-sm font-medium text-ink-2 inline-flex items-center gap-1.5 hover:border-brand hover:text-brand';

        ${stat(view.streak, 'ngày liên tiếp')}
        ${stat(view.speakingAvg == null ? '–' : view.speakingAvg + '%', 'điểm nói trung bình')}

/* ---------- Hộp thoại ---------- */

  // Hộp thanh toán: mã QR, số tài khoản, nội dung chuyển khoản (= email), nút "Tôi đã chuyển khoản" báo cho giáo viên.
  activate(mode) {

    const head = (title) => `<div class="flex items-start gap-3">
        <span class="size-11 shrink-0 grid place-items-center rounded-2xl bg-brand-soft text-brand">${icon('key', 'size-5')}</span>
        <div class="min-w-0 flex-1 pt-0.5">

        </div>
        <button type="button" data-action="modal-close" aria-label="Đóng" class="size-9 -mt-1 -mr-1 grid place-items-center rounded-lg text-ink-3 hover:bg-paper hover:text-ink">${icon('x', 'size-5')}</button>
      </div>`;
    // Chưa đóng tiền: chọn trước là học viên lớp (miễn phí) hay đóng học phí. Chỉ người đóng học phí mới chọn bài.
    if (!session.active && mode !== 'pay') {
      const card = (action, tone, ic, title, text) => `<button type="button" data-action="${action}" class="w-full text-left flex items-center gap-3 p-4 rounded-2xl border-2 ${tone} transition">

          ${card('free-form', 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:border-emerald-400', 'user', 'Đang là học viên tại lớp', 'Miễn phí · gửi họ tên và lớp để cô mở khóa')}
        </div>`);
      return;
    }
    const line = (label, value, copy, id) => value ? `<div class="flex items-center gap-2 h-11 px-3 rounded-xl bg-paper border border-line">
        <span class="w-24 shrink-0 text-xs text-ink-3">${esc(label)}</span>
        <span ${id ? `id="${id}"` : ''} class="min-w-0 flex-1 truncate font-semibold select-all">${esc(value)}</span>
        ${copy ? `<button type="button" data-action="copy-text" data-text="${esc(value)}" aria-label="Sao chép ${esc(label)}" class="size-8 shrink-0 grid place-items-center rounded-lg text-ink-3 hover:bg-white hover:text-brand">${icon('copy', 'size-4')}</button>` : ''}
      </div>` : '';
    // Bài đã có (còn hạn) thì không chọn lại; mặc định chọn sẵn 5 bài kế tiếp chưa có.
    const total = APP_CONFIG.lessons.length;
    const owned = session.active || session.expired ? lessonSet(session.maxLessons) : new Set();
    const ownsAll = owned.size >= total;
    if (hasEverything(session)) {
      this.open(`${head('Khóa học của bạn')}
        <p class="mt-4 flex items-start gap-2 text-sm text-emerald-700">${icon('circle-check', 'size-5 shrink-0')}<span>Bạn đang học được toàn bộ ${total} bài, không giới hạn thời gian. Không cần gia hạn.</span></p>`);
      return;
    }
    if (ui.months == null) ui.months = (ownsAll && session.expiresAt) || session.expired ? 1 : 0;   // đã đủ bài / đã hết hạn: gợi ý gia hạn 1 tháng
    if (ui.pick) owned.forEach((n) => ui.pick.delete(n));
    if (!ui.pick || !ui.pick.size) {
      ui.pick = new Set();
      for (let n = 1; n <= total && ui.pick.size < (pay.blockSize || 5); n++) if (!owned.has(n)) ui.pick.add(n);
    }
    const chip = (n) => {
      const lesson = APP_CONFIG.lessons[n - 1];
      const have = owned.has(n);
      const on = ui.pick.has(n);
      return `<button type="button" data-action="pick-lesson" data-n="${n}" ${have ? 'disabled' : ''} aria-pressed="${on}" title="${esc(lesson ? lesson.title : 'Bài ' + n)}${have ? ' (đã có)' : ''}"
        class="pick-chip h-10 rounded-lg border-2 text-sm font-bold tabular-nums transition ${have ? 'border-emerald-200 bg-emerald-50 text-emerald-600' : on ? 'border-brand bg-brand text-white' : 'border-line text-ink-2 hover:border-brand/60'}">${have ? icon('check', 'size-4 mx-auto') : n}</button>`;
    };
    const books = (APP_CONFIG.books && APP_CONFIG.books.length ? APP_CONFIG.books : [{ name: 'Bài học', from: 1, to: total }]).map((book) => `<div class="mt-3">
        <div class="flex items-center justify-between gap-2"><span class="text-xs font-semibold text-ink-2">${esc(book.name)} · Bài ${book.from} – ${book.to}</span>
          <button type="button" data-action="pick-book" data-from="${book.from}" data-to="${book.to}" class="h-7 px-2.5 rounded-lg text-xs font-semibold text-brand hover:bg-brand-soft">Chọn cả sách</button></div>
        <div class="mt-1.5 grid grid-cols-5 sm:grid-cols-8 gap-1.5">${Array.from({ length: book.to - book.from + 1 }, (_, i) => chip(book.from + i)).join('')}</div>
      </div>`).join('');
    this.open(`${head(session.active ? 'Gia hạn / Mua thêm bài' : 'Đóng học phí')}
      ${session.active ? '' : `<button type="button" data-action="activate" class="mt-2 h-8 px-2 -ml-2 rounded-lg text-sm text-ink-2 inline-flex items-center gap-1 hover:text-brand">${icon('chevron-left', 'size-4')}Quay lại</button>`}
      ${ownsAll ? `<p class="mt-3 flex items-center gap-2 text-sm text-emerald-700">${icon('circle-check', 'size-4')}Bạn đã có đủ ${total} bài</p>` : ''}
      <div class="mt-3 p-3 rounded-2xl border border-line" ${ownsAll ? 'hidden' : ''}>
        <div class="flex items-center justify-between gap-2">
          <span class="font-semibold">Chọn bài muốn học</span>
          <button type="button" data-action="pick-clear" class="h-7 px-2.5 rounded-lg text-xs font-medium text-ink-3 hover:text-rose-600">Bỏ chọn</button>

        ${books}
        <p id="pick-hint" class="mt-3 text-xs font-medium text-gold"></p>
      </div>
      ${session.expired || (session.active && session.expiresAt) ? `<div class="mt-3 p-3 rounded-2xl border border-line flex flex-wrap items-center gap-3">
        <div class="min-w-0 flex-1 basis-52">
          <p class="font-semibold">Gia hạn thời gian</p>
          <p class="text-xs text-ink-2">${esc(Number(pay.monthPrice || 10000).toLocaleString('vi-VN'))}đ / tháng${session.expiresAt ? ` · ${session.expired ? 'Đã hết hạn' : 'Hạn hiện tại'} ${fmtDate(session.expiresAt)}` : ''}</p>
          <p id="month-new" class="text-xs font-medium text-brand"></p>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" data-action="pick-month" data-d="-1" aria-label="Bớt 1 tháng" class="size-10 grid place-items-center rounded-lg border border-line text-lg font-bold hover:border-brand hover:text-brand">−</button>
          <span id="month-count" class="w-20 text-center font-bold tabular-nums"></span>
          <button type="button" data-action="pick-month" data-d="1" aria-label="Thêm 1 tháng" class="size-10 grid place-items-center rounded-lg border border-line text-lg font-bold hover:border-brand hover:text-brand">+</button>
        </div>
      </div>` : ''}
      ${pay.qrImage ? `<img src="${esc(pay.qrImage)}" alt="Mã QR chuyển khoản" class="mt-4 mx-auto w-full max-w-[260px] aspect-square object-contain rounded-xl border border-line bg-white" onerror="this.remove()">` : ''}
      <div class="mt-4 grid gap-2">
        <div class="flex items-center gap-2 min-h-11 py-2 px-3 rounded-xl bg-brand-soft border border-brand/30"><span class="w-24 shrink-0 text-xs text-ink-3">Số tiền</span><span id="pay-amount" class="min-w-0 flex-1 font-bold text-brand"></span></div>
        ${line('Ngân hàng', pay.bank, false)}
        ${line('Số tài khoản', pay.accountNumber, true)}
        ${line('Chủ tài khoản', pay.accountName, false)}
        ${line('Nội dung CK', session.email || '', true)}
      </div>
      <button type="button" data-action="paid" data-kind="${renew ? 'renew' : 'activate'}" class="mt-4 w-full h-12 rounded-xl bg-brand text-white font-semibold inline-flex items-center justify-center gap-2 hover:bg-brand-dark disabled:opacity-60">${icon('check')}<span>Tôi đã chuyển khoản</span></button>
      <a href="mailto:${esc(APP_CONFIG.teacherEmail || '')}?subject=${encodeURIComponent(renew ? 'Gia hạn khóa học E-Learning' : 'Kích hoạt tài khoản E-Learning')}&body=${encodeURIComponent('Email tài khoản: ' + (session.email || ''))}" class="mt-2 h-10 w-full rounded-xl text-sm text-ink-2 inline-flex items-center justify-center gap-2 hover:text-brand">${icon('mail', 'size-4')}${esc(APP_CONFIG.teacherEmail || '')}</a>`);
    this.updatePick();
  },
  // Cập nhật số bài đã chọn, số tiền và nút báo chuyển khoản (không vẽ lại cả hộp thoại).
  updatePick() {
    const pay = APP_CONFIG.payment || {};
    const size = Number(pay.blockSize) || 5;
    const price = Number(pay.blockPrice) || 50000;
    const count = ui.pick ? ui.pick.size : 0;
    const blocks = Math.ceil(count / size);
    const money = (blocks * price).toLocaleString('vi-VN') + 'đ';
    const session = store.session || {};
    const months = (session.expired || (session.active && session.expiresAt)) ? Math.max(0, ui.months || 0) : 0;
    const monthMoney = months * (Number(pay.monthPrice) || 10000);
    const totalMoney = (blocks * price + monthMoney).toLocaleString('vi-VN') + 'đ';
    const mc = $('#month-count');
    if (mc) mc.textContent = months ? `${months} tháng` : 'Không';
    const mn = $('#month-new');
    if (mn) {
      // Hạn mới: cộng từ hạn hiện tại (còn hạn) hoặc từ hôm nay (đã hết hạn / chưa có hạn).
      let next = '';
      if (months && session.expiresAt) {
        const base = new Date(Math.max(Date.now(), (endOfDate(session.expiresAt) || new Date()).getTime()));
        const day = base.getDate(); base.setDate(1); base.setMonth(base.getMonth() + months); base.setDate(Math.min(day, new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate()));   // 31/12 + 2 tháng = 28/02, không tràn sang tháng 3
        next = `${String(base.getDate()).padStart(2, '0')}/${String(base.getMonth() + 1).padStart(2, '0')}/${base.getFullYear()}`;
      }
      mn.textContent = next ? `Hạn mới: ${next}` : '';
      mn.dataset.next = next;
    }
    $$('#modal-card .pick-chip').forEach((b) => {
      if (b.disabled) return;
      const on = ui.pick.has(Number(b.dataset.n));
      b.setAttribute('aria-pressed', String(on));
      b.className = b.className.replace(/border-brand bg-brand text-white|border-line text-ink-2 hover:border-brand\/60/, on ? 'border-brand bg-brand text-white' : 'border-line text-ink-2 hover:border-brand/60');
    });
    const amount = $('#pay-amount');
    const parts = [];
    if (count) parts.push(`${count} bài (${lessonSpec(ui.pick)})`);
    if (months) parts.push(`gia hạn ${months} tháng`);
    if (amount) amount.textContent = parts.length ? `${totalMoney} · ${parts.join(' + ')}` : 'Chưa chọn bài hoặc số tháng';
    const hint = $('#pick-hint');
    if (hint) hint.textContent = count && count % size ? `Chọn thêm ${size - (count % size)} bài nữa vẫn cùng giá ${money}` : '';
    const paid = $('#modal-card [data-action="paid"]');
    if (paid) {
      paid.disabled = !count && !months;
      paid.dataset.plan = parts.length ? `${parts.join(' + ').replace(/ \(.*?\)/, '')} – ${totalMoney}` : '';
      paid.dataset.lessons = lessonSpec(ui.pick);
      paid.dataset.months = String(months);
      paid.dataset.until = mn ? mn.dataset.next || '' : '';
      const all = new Set([...(session.active || session.expired ? lessonSet(session.maxLessons) : []), ...ui.pick]);
      paid.dataset.merged = lessonSpec(all);
    }
  },
  // Học viên đang học tại lớp: nhập họ tên và lớp, gửi yêu cầu mở khóa miễn phí cho giáo viên.

    const session = store.session || {};

        <span class="text-xs font-medium text-ink-2">${esc(label)}</span>
        <input id="${id}" type="text" value="${esc(value || '')}" placeholder="${esc(placeholder)}" maxlength="80" autocomplete="off" class="mt-1 w-full h-11 px-3 rounded-xl border border-line bg-surface focus:border-brand focus:outline-none">
      </label>`;
    this.open(`<div class="flex items-start gap-3">
        <span class="size-11 shrink-0 grid place-items-center rounded-2xl bg-emerald-50 text-emerald-600">${icon('user', 'size-5')}</span>
        <div class="min-w-0 flex-1 pt-0.5">
          <h2 id="modal-title" class="font-semibold leading-tight">Học viên đang học tại lớp</h2>
          <p class="mt-0.5 text-sm text-ink-2 truncate">${esc(session.email || '')}</p>
        </div>
        <button type="button" data-action="modal-close" aria-label="Đóng" class="size-9 -mt-1 -mr-1 grid place-items-center rounded-lg text-ink-3 hover:bg-paper hover:text-ink">${icon('x', 'size-5')}</button>
      </div>
      <div class="mt-4 grid gap-3">
        ${field('free-name', 'Họ và tên', session.name, 'Nguyễn Văn A')}

/* ---------- Pháo giấy khi hoàn thành bài ---------- */
function confettiBurst() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = $('#confetti');
  const ctx = canvas.getContext('2d');
  const ratio = Math.min(2, window.devicePixelRatio || 1);
  const width = canvas.width = Math.floor(window.innerWidth * ratio);
  const height = canvas.height = Math.floor(window.innerHeight * ratio);
  canvas.hidden = false;
  const colors = ['#1f47b4', '#7ea2ff', '#10b981', '#fbbf24', '#b3261e'];
  const pieces = Array.from({ length: 110 }, () => ({
    x: width / 2 + (Math.random() - 0.5) * width * 0.25,
    y: height * 0.32,
    vx: (Math.random() - 0.5) * 16 * ratio,
    vy: (-Math.random() * 13 - 5) * ratio,
    size: (Math.random() * 6 + 5) * ratio,
    spin: Math.random() * Math.PI,
    vs: (Math.random() - 0.5) * 0.4,
    color: colors[Math.floor(Math.random() * colors.length)]
  }));
  const start = performance.now();
  const frame = (now) => {
    const elapsed = now - start;
    ctx.clearRect(0, 0, width, height);
    pieces.forEach((piece) => {
      piece.vy += 0.42 * ratio;
      piece.x += piece.vx;
      piece.y += piece.vy;
      piece.vx *= 0.99;
      piece.spin += piece.vs;
      ctx.save();
      ctx.translate(piece.x, piece.y);
      ctx.rotate(piece.spin);
      ctx.globalAlpha = Math.max(0, 1 - elapsed / 2200);
      ctx.fillStyle = piece.color;
      ctx.fillRect(-piece.size / 2, -piece.size / 4, piece.size, piece.size / 2);
      ctx.restore();
    });
    if (elapsed < 2200) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, width, height); canvas.hidden = true; }
  };
  requestAnimationFrame(frame);
}

/* ---------- Bộ điều phối ---------- */
const App = {
  show(view) {
    ui.view = view;
    ['gate', 'app', 'builder'].forEach((name) => { $('#view-' + name).hidden = name !== view; });
  },

  /* Cổng đăng nhập / đăng ký */
  gateMode: 'login',
  setGateMode(mode) {
    this.gateMode = mode === 'register' ? 'register' : 'login';
    const register = this.gateMode === 'register';
    $('#gate-name-row').hidden = !register;
    $('#gate-forgot').hidden = register;
    $('#gate-submit-label').textContent = register ? 'Tạo tài khoản' : 'Đăng nhập';
    $('#gate-password').setAttribute('autocomplete', register ? 'new-password' : 'current-password');
    ['login', 'register'].forEach((name) => {
      const tab = $('#gate-tab-' + name);
      const on = name === this.gateMode;
      tab.setAttribute('aria-selected', String(on));
      tab.className = `h-9 rounded-lg transition-colors ${on ? 'bg-surface text-brand shadow-sm' : 'text-ink-2 hover:text-ink'}`;
    });
    $('#gate-error').hidden = true;
  },
  showGate(message) {
    Player.destroy();
    Sound.stop();
    Voice.release();
    Modal.close();
    this.show('gate');
    this.setGateMode('login');
    const error = $('#gate-error');
    error.hidden = !message;
    error.innerHTML = message ? `${icon('alert')}<span>${esc(message)}</span>` : '';
    $('#gate-password').value = '';
    const email = $('#gate-email');
    (email.value ? $('#gate-password') : email).focus();
  },
  async submitAuth() {
    const register = this.gateMode === 'register';
    const name = $('#gate-name').value.trim();
    const email = cleanEmail($('#gate-email').value);
    const password = $('#gate-password').value;
    const button = $('#gate-submit');
    const error = $('#gate-error');
    const fail = (reason, field) => {
      error.hidden = false;
      error.innerHTML = `${icon('alert')}<span>${esc(Account.message(reason))}</span>`;
      shakeNode($('#gate-form'));
      const node = $(field);
      if (node) node.focus();
    };
    if (register && name.length < 2) { fail('name', '#gate-name'); return; }
    if (!EMAIL_RE.test(email)) { fail('email', '#gate-email'); return; }
    if (password.length < 6) { fail(register ? 'password' : 'invalid', '#gate-password'); return; }
    button.disabled = true;
    const result = register ? await Account.register(name, email, password) : await Account.login(email, password);
    button.disabled = false;
    if (!result.ok) { fail(result.reason, result.reason === 'exists' || result.reason === 'email' ? '#gate-email' : result.reason === 'name' ? '#gate-name' : '#gate-password'); return; }
    error.hidden = true;
    $('#gate-password').value = '';
    this.enter();
    if (register && !store.session.active && !isTeacher()) Modal.activate();   // vừa đăng ký: chỉ cách kích hoạt
  },
  logout(message) {

    store.session = null;
    persist();
    this.showGate(message);

  // Máy chủ báo phiên không còn hợp lệ (đăng nhập ở thiết bị khác, đổi mật khẩu…).
  sessionLost() {
    if (store.session) this.logout(Account.message('session'));
  },

  /* Vào học */
  enter() {

    ui.test = null;
    ui.pick = null;
    ui.months = null;

        node.firstChild.onerror = () => { node.style.background = ''; node.style.boxShadow = ''; node.textContent = APP_CONFIG.seal || '学'; };

    }

  /* Chọn bài */
  openLesson(id, options) {
    const lesson = getLesson(id);
    if (!lesson) return;
    const access = lessonAccess(lesson);
    if (access === 'soon') { toast(`${lesson.title} sắp ra mắt`, 'info'); return; }
    if (access === 'plan') { Modal.activate(); return; }
    if (access === 'locked') {
      const block = testBlocking(lessonIndex(id) + 1);
      if (block) {
        toast(`${block.title} chưa đạt: làm lại Nghe, Nói, Đọc, Viết của Bài ${block.range[0]} – ${block.range[1]}`, 'warn', 4200);
        shakeNode($(`#sidebar [data-id="${CSS.escape(id)}"]`));
        return;
      }
      const previous = APP_CONFIG.lessons[lessonIndex(id) - 1];
      toast(`Hoàn thành ${previous ? previous.title : 'bài trước'} để mở khóa`, 'warn');
      shakeNode($(`#sidebar [data-id="${CSS.escape(id)}"]`));
      return;
    }
    applyTestRedo(null);
    if (ui.lessonId === id && !ui.testId && !(options && options.force)) return;
    ui.testId = null;
    Voice.release();
    Sound.stop();
    clearInterval(ui.spTimer);
    ui.lessonId = id;
    ui.page = {}; ui.wrong = {}; ui.played = {}; ui.playing = null; ui.drafts = {}; ui.order = {}; ui.fill = {}; ui.deck = {}; ui.sp = {};
    userProgress().lastLesson = id;
    persist();
    ui.tab = nextTab(lesson) || 'video';
    if (!this.canOpenTab(lesson, ui.tab)) ui.tab = 'video';
    $('#player').hidden = false;
    this.applyTab();
    Player.load(lesson);
    this.renderStepper();
    this.renderPanel();
    this.renderSidebar();
    $('#panel').scrollTop = 0;
  },

  /* Chuyển bước */
  canOpenTab(lesson, tab) {
    if (tab === 'video' || EXTRA_KEYS.includes(tab)) return true;
    return isTeacher() || lessonStatus(lesson).videoDone;   // Nghe - Nói - Đọc - Viết chỉ mở sau khi xong video
  },
  applyTab() {
    Player.setMini(ui.tab !== 'video');
    $('#panel').dataset.compact = String(ui.tab === 'video');
  },
  setTab(tab) {
    const lesson = currentLesson();
    if (!lesson || tab === ui.tab || !TAB_META[tab] || !this.canOpenTab(lesson, tab)) return;
    if (Player.isLocked() && tab !== 'video') return;   // đang có câu hỏi mốc dừng: trả lời trước đã
    if (ui.tab === 'speaking') { Voice.release(); clearInterval(ui.spTimer); }
    Sound.stop();
    ui.tab = tab;
    this.applyTab();
    this.renderStepper();
    this.renderPanel();
    $('#panel').scrollTop = 0;
  },

  /* Sau mỗi thay đổi tiến trình: lưu, ghi ngày học, kiểm tra mở khóa */
  progressChanged(lessonId, info) {
    const lesson = getLesson(lessonId);
    if (!lesson) return;
    const p = LP(lessonId);
    const st = lessonStatus(lesson);
    const up = userProgress();
    addUnique(up.days, dayKey(new Date()));
    let unlockedNext = null;
    if (checkLessonUnlock(lessonId) && !p.done) {
      p.done = true;
      p.doneAt = new Date().toISOString();
      const next = APP_CONFIG.lessons[lessonIndex(lessonId) + 1];
      if (next) {
        addUnique(up.unlocked, next.id);
        if (lessonAccess(next) === 'open') unlockedNext = next;
      }
      ui.justUnlocked = unlockedNext ? unlockedNext.id : null;
      confettiBurst();
      toast(unlockedNext ? `Đã mở khóa ${unlockedNext.title}` : `Hoàn thành ${lesson.title}`, 'ok', 4200);
    }
    persist();
    Cloud.schedule();
    if (ui.view === 'app') {
      this.renderStepper();
      this.renderSidebar();
      Player.refresh();
    }
    if (info && info.videoJustEnded && st.videoDone && ui.lessonId === lessonId) {
      toast('Đã mở 4 kỹ năng: Nghe, Nói, Đọc, Viết', 'ok');
      if (ui.tab === 'video') this.renderPanel();
    }
  },
  autoAdvance(key, count, isDone) {
    const lessonId = ui.lessonId;
    const tab = ui.tab;
    setTimeout(() => {
      if (ui.lessonId !== lessonId || ui.tab !== tab) return;
      const from = ui.page[key] || 0;
      for (let step = 1; step <= count; step++) {
        const i = (from + step) % count;
        if (!isDone(i)) {
          ui.page[key] = i;
          this.renderPanel();
          return;
        }
      }
    }, 750);
  },
  afterReset() {
    ui.resetArmed = 0;
    if (!store.session) { this.showGate(); return; }
    ui.lessonId = null;
    this.enter();
  },

  /* Vẽ 5 bước + 2 thẻ phụ */
  renderStepper() {
    const lesson = currentLesson();
    if (!lesson) { $('#stepper').innerHTML = ''; return; }
    const st = lessonStatus(lesson);
    const open = st.videoDone || isTeacher();
    const button = (key, badge, lockedStep, label, inline) => {
      const active = ui.tab === key;
      const done = st.parts[key];
      const badgeTone = done ? 'bg-emerald-500 text-white' : active ? 'bg-white/20 text-white' : 'bg-paper text-ink-2';
      return `<button type="button" role="tab" id="tab-${key}" aria-selected="${active}" data-action="tab" data-tab="${key}" ${lockedStep ? 'aria-disabled="true" tabindex="-1"' : ''}
        class="flex-1 sm:flex-none min-w-0 flex ${inline ? 'flex-row gap-2 text-sm' : 'flex-col sm:flex-row gap-1 sm:gap-2 text-[11px] sm:text-sm'} items-center justify-center px-1 sm:px-3 py-1.5 rounded-xl font-medium leading-tight transition-colors ${active ? 'bg-brand text-white' : 'text-ink-2 hover:bg-paper'} ${lockedStep ? 'pointer-events-none opacity-50' : ''}">
        <span class="size-6 shrink-0 grid place-items-center rounded-full text-xs font-semibold tabular-nums ${badgeTone}">${done ? icon('check', 'size-3.5') : lockedStep ? icon('lock', 'size-3') : badge}</span>
        <span class="whitespace-nowrap">${label}</span>
      </button>`;
    };
    const arrow = `<span class="hidden sm:grid place-items-center text-ink-3" aria-hidden="true">${icon('chevron-right', 'size-4')}</span>`;
    const steps = STEP_KEYS.map((key, i) => {
      const label = key === 'video' ? '<span class="sm:hidden">Video</span><span class="max-sm:hidden">Xem video</span>' : TAB_META[key].label;
      return button(key, String(i + 1), i > 0 && !open, label);
    }).join(arrow);
    const extras = EXTRA_KEYS.map((key) => button(key, icon(TAB_META[key].icon, 'size-3.5'), false, TAB_META[key].label, true)).join('');
    const group = 'min-w-0 flex items-stretch gap-0.5 p-1 bg-surface border border-line rounded-2xl';
    $('#stepper').innerHTML = `<div role="tablist" aria-label="5 bước" class="w-full sm:w-auto ${group}">${steps}</div>
      <div role="tablist" aria-label="Ôn tập" class="w-full sm:w-auto sm:ml-auto ${group}">${extras}</div>`;
  },

  /* Vẽ bảng nội dung, giữ nguyên tiêu điểm bàn phím */
  renderPanel() {
    if (ui.testId) { Tests.render(); return; }
    const lesson = currentLesson();
    const panel = $('#panel');
    if (!lesson) { panel.innerHTML = ''; return; }
    let focusKey = null;
    const active = document.activeElement;
    if (active && panel.contains(active)) {
      focusKey = active.id ? '#' + CSS.escape(active.id) : null;
      if (!focusKey && active.dataset && active.dataset.action) {
        focusKey = `[data-action="${active.dataset.action}"]` + ['scope', 'index', 'i', 'rate', 'key', 'w', 'b', 'v', 'pos', 'tab'].filter((k) => active.dataset[k] != null).map((k) => `[data-${k}="${CSS.escape(active.dataset[k])}"]`).join('');
      }
    }
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'tab-' + ui.tab);
    panel.innerHTML = Panels[ui.tab](lesson);
    if (focusKey) {
      const again = panel.querySelector(focusKey);
      if (again && !again.disabled) again.focus({ preventScroll: true });
    }
  },

  /* Vẽ lộ trình */
  renderSidebar() {
    const lessons = APP_CONFIG.lessons;
    const view = progressOverview();
    const percent = view.percent;
    const items = lessons.map((lesson, index) => {
      const access = lessonAccess(lesson);
      const st = lessonStatus(lesson);
      const noVideo = !hasMedia(lesson);
      const complete = !noVideo && st.doneCount === st.total;
      const active = lesson.id === ui.lessonId;
      const fresh = ui.justUnlocked === lesson.id;
      const badge = access === 'soon' ? icon('clock', 'size-4') : access === 'plan' ? icon('crown', 'size-4') : access === 'locked' ? icon('lock', 'size-4') : complete ? icon('check', 'size-4') : fresh ? icon('unlock', 'size-4') : String(index + 1);
      const badgeTone = access === 'plan' ? 'bg-amber-50 text-gold' : access === 'locked' || access === 'soon' ? 'bg-paper text-ink-3' : complete ? 'bg-emerald-500 text-white' : active ? 'bg-brand text-white' : 'bg-brand-soft text-brand';
      const segments = PART_KEYS.map((key) => `<span title="${TAB_META[key].label}" class="h-1 flex-1 rounded-full ${st.parts[key] ? 'bg-emerald-500' : 'bg-line'}"></span>`).join('');
      const state = access === 'soon' ? 'Sắp ra mắt' : access === 'plan' ? (store.session.active ? 'Ngoài gói học' : 'Cần kích hoạt tài khoản') : access === 'locked' ? 'Chưa mở khóa' : noVideo ? 'Chưa có video' : complete ? 'Đã hoàn thành' : `${st.doneCount}/${st.total} phần`;
      const foot = noVideo
        ? `<span class="mt-1.5 inline-flex items-center h-5 px-1.5 rounded text-[11px] font-semibold ${access === 'soon' ? 'bg-paper text-ink-2' : 'bg-amber-50 text-gold'}">${state}</span>`
        : `<span class="mt-2 flex gap-1" aria-hidden="true">${segments}</span>`;
      return `<button type="button" data-action="open-lesson" data-id="${esc(lesson.id)}" ${active ? 'aria-current="true"' : ''} aria-label="${esc(lesson.title)} — ${state}"
        class="w-full text-left flex items-start gap-3 p-3 rounded-xl border transition-colors ${active ? 'border-brand bg-brand-soft' : 'border-line hover:border-brand'} ${access === 'open' ? '' : 'opacity-70'}">
        <span class="size-9 shrink-0 grid place-items-center rounded-lg text-sm font-semibold tabular-nums ${badgeTone} ${fresh ? 'animate-pop' : ''}">${badge}</span>
        <span class="min-w-0 flex-1">
          <span class="block font-medium leading-tight truncate" lang="${esc(lesson.lang)}">${esc(lesson.title)}</span>
          ${lesson.subtitle ? `<span class="block mt-0.5 text-xs text-ink-2 truncate">${esc(lesson.subtitle)}</span>` : ''}
          ${foot}
        </span>
      </button>` + testSidebarItem(index + 1);
    }).join('');
    const session = store.session || {};
    const upgrade = !isTeacher() && !hasEverything()
      ? (() => {
        const left = session.active && session.expiresAt ? daysLeft(session.expiresAt) : null;
        const soon = left != null && left >= 0 && left <= 7;   // sắp hết hạn: nhắc gia hạn
        return `<button type="button" data-action="activate" class="mt-auto h-10 rounded-xl text-sm font-medium inline-flex items-center justify-center gap-2 ${soon ? 'bg-rose-50 text-rose-600 hover:bg-rose-100' : 'text-brand hover:bg-brand-soft'}">${icon('key')}${soon ? `Còn ${left} ngày · Gia hạn` : session.active ? 'Gia hạn / Mua thêm bài' : session.expired ? 'Gia hạn khóa học' : 'Kích hoạt tài khoản'}</button>`;
      })()
      : '';
    $('#sidebar').innerHTML = `<div class="px-1 pt-1 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h2 class="text-sm font-semibold">Lộ trình</h2>
          <span class="text-xs text-ink-2 tabular-nums">${view.doneLessons}/${view.totalLessons} bài</span>
        </div>
        <div class="mt-2 flex items-center gap-2.5">
          <div class="flex-1 h-1.5 rounded-full bg-paper overflow-hidden" role="progressbar" aria-label="Tiến độ lộ trình" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}">
            <div class="h-full rounded-full bg-brand transition-[width] duration-500" style="width:${percent}%"></div>
          </div>
          <span class="text-xs font-semibold tabular-nums text-brand">${percent}%</span>
        </div>
      </div>
      <div class="flex flex-col gap-2">${items}</div>
      ${upgrade}`;
    ui.justUnlocked = null;
  }
};
