const Actions = {
  /* ----- Điều hướng ----- */
  tab(button) { App.setTab(button.dataset.tab); },
  'open-lesson'(button) { App.openLesson(button.dataset.id); },
  page(button) {
    ui.page[button.dataset.key] = Number(button.dataset.i);
    if (button.dataset.key === 'speaking') { Voice.cancel(); clearInterval(ui.spTimer); }
    Sound.stop();
    App.renderPanel();
  },
  logout() { App.logout(); },

  /* ----- Tài khoản ----- */
  'gate-mode'(button) {
    App.setGateMode(button.dataset.mode);
    $(button.dataset.mode === 'register' ? '#gate-name' : '#gate-email').focus();
  },
  'gate-eye'(button) {
    const input = $('#gate-password');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    button.innerHTML = icon(show ? 'eye-off' : 'eye', 'size-5');
    button.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  },
  forgot() { Modal.forgot(); },
  activate() { Modal.activate(); },
  me() {
    ui.mePassword = false;
    ui.resetArmed = 0;
    Modal.me();
  },
  'me-password'() {
    ui.mePassword = !ui.mePassword;
    Modal.me();
    const field = $('#me-old');
    if (field) field.focus();
  },

  /* ----- Trắc nghiệm (Nghe, Đọc, Ôn bài cũ, Xem trước) ----- */
  choose(button) {
    const lesson = currentLesson();
    const p = LP(lesson.id);
    const scope = button.dataset.scope;
    const index = Number(button.dataset.index);
    const picked = Number(button.dataset.i);
    const source = {
      listening: lesson.skills.listening,
      reading: lesson.skills.reading.questions,
      review: lesson.reviewOld.exercises,
      preview: lesson.previewNew.exercises
    }[scope];
    const item = source && source[index];
    if (!item) return;
    const key = `${scope}:${index}`;
    if (picked === Number(item.correct)) {
      delete ui.wrong[key];
      if (scope === 'listening') addUnique(p.listening, index);
      else if (scope === 'reading') addUnique(p.reading, index);
      else if (scope === 'review') p.review[index] = true;
      else p.preview.ex[index] = true;
      Sound.stop();
      App.progressChanged(lesson.id);
      App.renderPanel();
      if (scope === 'listening') App.autoAdvance('listening', source.length, (i) => p.listening.includes(i));
      if (scope === 'review') App.autoAdvance('review', source.length, (i) => exerciseDone(source[i], p.review[i]));
      if (scope === 'preview') App.autoAdvance('preview', source.length, (i) => exerciseDone(source[i], p.preview.ex[i]));
    } else {
      (ui.wrong[key] = ui.wrong[key] || []).push(picked);
      App.renderPanel();
      shakeNode($(`#panel [data-action="choose"][data-scope="${scope}"][data-index="${index}"][data-i="${picked}"]`));
      const next = $(`#panel [data-action="choose"][data-scope="${scope}"][data-index="${index}"]:not(:disabled)`);
      if (next) next.focus({ preventScroll: true });
    }
  },

  /* ----- Nghe ----- */
  listen(button) {
    const lesson = currentLesson();
    const index = Number(button.dataset.index);
    const rate = Number(button.dataset.rate) || 1;
    const item = lesson.skills.listening[index];
    const token = `listening:${index}@${rate}`;
    if (ui.playing === token) { Sound.stop(); return; }
    ui.played[`listening:${index}`] = true;
    ui.playing = token;
    Sound.play({
      audioUrl: item.audioUrl || autoAudio(lesson, 'nghe', index),
      text: item.audioText,
      lang: lesson.lang,
      rate,
      onEnd: () => {
        if (ui.playing === token) ui.playing = null;
        if (ui.tab === 'listening' && ui.lessonId === lesson.id) App.renderPanel();
      }
    });
    App.renderPanel();
  },

  /* ----- Nói ----- */
  'sp-sample'(button) {
    const lesson = currentLesson();
    const index = Number(button.dataset.index);
    const rate = Number(button.dataset.rate) || 1;
    const item = lesson.skills.speaking[index];
    const token = `speaking:${index}@${rate}`;
    if (ui.playing === token) { Sound.stop(); return; }
    if (ui.sp[index] && ui.sp[index].phase === 'recording') return;
    const st = ui.sp[index] = ui.sp[index] || {};
    ui.playing = token;
    Sound.play({
      audioUrl: item.audioUrl || autoAudio(lesson, 'noi', index),
      text: item.text,
      lang: lesson.lang,
      rate,
      onEnd: () => {
        if (ui.playing === token) ui.playing = null;
        st.heardSample = true;
        confirmSelfSpeaking(lesson, index);
        if (ui.tab === 'speaking' && ui.lessonId === lesson.id) App.renderPanel();
      }
    });
    App.renderPanel();
  },
  'sp-replay'(button) {
    const lesson = currentLesson();
    const index = Number(button.dataset.index);
    const st = ui.sp[index];
    if (!st || !st.clipUrl) return;
    const token = `self:${index}`;
    if (ui.playing === token) { Sound.stop(); return; }
    ui.playing = token;
    Sound.play({
      audioUrl: st.clipUrl,
      onEnd: () => {
        if (ui.playing === token) ui.playing = null;
        st.heardSelf = true;
        confirmSelfSpeaking(lesson, index);
        if (ui.tab === 'speaking' && ui.lessonId === lesson.id) App.renderPanel();
      }
    });
    App.renderPanel();
  },
  async 'sp-record'(button) {
    const lesson = currentLesson();
    const index = Number(button.dataset.index);
    const st = ui.sp[index] = ui.sp[index] || {};
    if (st.phase === 'recording') { Voice.stop(); return; }
    st.phase = 'recording';
    st.live = '';
    st.error = null;
    st.result = null;
    const began = Date.now();
    App.renderPanel();
    clearInterval(ui.spTimer);
    ui.spTimer = setInterval(() => {
      const clock = $('#sp-clock');
      if (clock) clock.textContent = fmtTime((Date.now() - began) / 1000);
    }, 250);
    await Voice.start({
      key: `${lesson.id}:${index}`,
      lang: lesson.lang,
      onLive: (text) => {
        st.live = text;
        const live = $('#sp-live');
        if (live) live.textContent = text;
      },
      onDone: (result) => finishSpeaking(lesson, index, result)
    });
  },

  /* ----- Đọc ----- */
  'toggle-pinyin'() {
    ui.showPinyin = !ui.showPinyin;
    App.renderPanel();
  },

  /* ----- Viết: sắp xếp từ ----- */
  'order-pick'(button) {
    const lesson = currentLesson();
    const index = Number(button.dataset.index);
    const item = lesson.skills.writing[index];
    const state = ui.order[index];
    if (!state) return;
    const word = Number(button.dataset.w);
    if (state.picked.includes(word)) return;
    state.picked.push(word);
    state.bad = false;
    if (state.picked.length === item.words.length) {
      const sentence = state.picked.map((w) => item.words[w]).join('');
      if (isAnswerAccepted(sentence, [item.answer].concat(item.acceptedAnswers || []))) {
        completeWriting(lesson, index);
        return;
      }
      state.bad = true;
      App.renderPanel();
      shakeNode($('#order-row'));
      return;
    }
    App.renderPanel();
  },
  'order-unpick'(button) {
    const state = ui.order[Number(button.dataset.index)];
    if (!state) return;
    state.picked.splice(Number(button.dataset.pos), 1);
    state.bad = false;
    App.renderPanel();
  },
  'order-reset'(button) {
    const state = ui.order[Number(button.dataset.index)];
    if (!state) return;
    state.picked = [];
    state.bad = false;
    App.renderPanel();
  },

  /* ----- Viết: gõ câu ----- */
  'write-check'(button) {
    const lesson = currentLesson();
    const index = Number(button.dataset.index);
    const item = lesson.skills.writing[index];
    const key = `writing:${index}`;
    const input = $('#write-input');
    const value = input ? input.value : (ui.drafts[key] || '');
    ui.drafts[key] = value;
    if (isAnswerAccepted(value, [item.answer].concat(item.acceptedAnswers || []))) {
      delete ui.wrong[key];
      completeWriting(lesson, index);
      return;
    }
    ui.wrong[key] = [1];
    App.renderPanel();
    const again = $('#write-input');
    shakeNode(again);
    if (again) { again.focus(); again.select(); }
  },

  /* ----- Điền từ ----- */
  'fill-slot'(button) {
    const key = `${button.dataset.scope}:${button.dataset.index}`;
    const state = ui.fill[key];
    if (!state) return;
    const b = Number(button.dataset.b);
    state.values[b] = '';
    state.bad = state.bad.filter((x) => x !== b);
    state.active = b;
    App.renderPanel();
  },
  'fill-pick'(button) {
    const lesson = currentLesson();
    const scope = button.dataset.scope;
    const index = Number(button.dataset.index);
    const exercise = (scope === 'review' ? lesson.reviewOld.exercises : lesson.previewNew.exercises)[index];
    const state = ui.fill[`${scope}:${index}`];
    if (!exercise || !state) return;
    let b = state.active;
    if (b == null || b < 0 || state.values[b]) b = state.values.findIndex((v) => !v);
    if (b < 0) return;
    state.values[b] = exercise.bank[Number(button.dataset.v)];
    state.bad = state.bad.filter((x) => x !== b);
    state.active = state.values.findIndex((v) => !v);
    if (state.active < 0) checkFill(lesson, scope, index);
    else App.renderPanel();
  },
  'fill-check'(button) {
    checkFill(currentLesson(), button.dataset.scope, Number(button.dataset.index));
  },

  /* ----- Thẻ lật ----- */
  'deck-flip'(button) {
    const lesson = currentLesson();
    const key = button.dataset.key;
    const state = ui.deck[key];
    if (!state) return;
    state.flipped = !state.flipped;
    const flip = button.closest('.flip');
    if (flip) flip.dataset.flipped = String(state.flipped);
    if (!state.flipped) return;
    const cards = deckCards(lesson, key);
    const seen = deckSeen(lesson, key);
    if (seen.includes(state.i)) return;
    const part = key.startsWith('review') ? 'review' : 'preview';
    const before = lessonStatus(lesson).parts[part];
    seen.push(state.i);
    const dots = button.closest('[data-deck]').querySelector('[data-deck-dots]');
    if (dots) dots.innerHTML = deckDots(cards, seen, state.i);
    App.progressChanged(lesson.id);
    const after = lessonStatus(lesson).parts[part];
    const lessonId = lesson.id;
    const tab = ui.tab;
    const scope = key.split(':')[0];
    const exerciseIndex = Number(key.split(':')[1]);
    const deckFinished = cards.every((_, i) => seen.includes(i));
    if (after !== before || (deckFinished && key !== 'preview:vocab')) {
      // Chờ thẻ lật xong rồi mới vẽ lại để hiện trạng thái hoàn thành / chuyển bài tập kế
      setTimeout(() => {
        if (ui.lessonId !== lessonId || ui.tab !== tab) return;
        if (deckFinished && key !== 'preview:vocab') {
          const exercises = scope === 'review' ? lesson.reviewOld.exercises : lesson.previewNew.exercises;
          const bag = scope === 'review' ? LP(lessonId).review : LP(lessonId).preview.ex;
          const nextOpen = exercises.findIndex((ex, i) => i !== exerciseIndex && !exerciseDone(ex, bag[i]));
          if (nextOpen >= 0) ui.page[scope] = nextOpen;
        }
        App.renderPanel();
      }, 900);
    }
  },
  'deck-prev'(button) { moveDeck(button.dataset.key, -1); },
  'deck-next'(button) { moveDeck(button.dataset.key, 1); },
  'deck-say'(button) {
    const lesson = currentLesson();
    const key = button.dataset.key;
    const state = ui.deck[key];
    const card = deckCards(lesson, key)[state ? state.i : 0];
    if (card) Sound.play({ audioUrl: card.audioUrl, text: card.word, lang: lesson.lang, rate: 1 });
  },

  /* ----- Công cụ giáo viên ----- */
  'open-builder'() { if (isTeacher()) Builder.open(); }
};

function moveDeck(key, delta) {
  const lesson = currentLesson();
  const cards = deckCards(lesson, key);
  const state = ui.deck[key];
  if (!state || !cards.length) return;
  state.i = (state.i + delta + cards.length) % cards.length;
  state.flipped = false;
  Sound.stop();
  App.renderPanel();
}

function completeWriting(lesson, index) {
  const p = LP(lesson.id);
  addUnique(p.writing, index);
  App.progressChanged(lesson.id);
  App.renderPanel();
  App.autoAdvance('writing', lesson.skills.writing.length, (i) => p.writing.includes(i));
}

function checkFill(lesson, scope, index) {
  const exercise = (scope === 'review' ? lesson.reviewOld.exercises : lesson.previewNew.exercises)[index];
  const key = `${scope}:${index}`;
  const state = ui.fill[key];
  if (!exercise || !state) return;
  $$(`#panel input[data-fill="${key}"]`).forEach((input) => { state.values[Number(input.dataset.b)] = input.value; });
  state.bad = state.values.map((value, b) => (isAnswerAccepted(value, fillAnswers(exercise, b)) ? -1 : b)).filter((b) => b >= 0);
  if (state.bad.length) {
    state.active = state.bad[0];
    App.renderPanel();
    shakeNode($(`#panel [data-fill-block="${key}"]`));
    return;
  }
  const p = LP(lesson.id);
  const bag = scope === 'review' ? p.review : p.preview.ex;
  bag[index] = true;
  App.progressChanged(lesson.id);
  App.renderPanel();
  const exercises = scope === 'review' ? lesson.reviewOld.exercises : lesson.previewNew.exercises;
  App.autoAdvance(scope, exercises.length, (i) => exerciseDone(exercises[i], bag[i]));
}

// Kết thúc một lượt đọc: chấm điểm độ khớp (có nhận diện giọng nói) hoặc chuyển sang thu âm đối chiếu.
function finishSpeaking(lesson, index, result) {
  clearInterval(ui.spTimer);
  const st = ui.sp[index] = ui.sp[index] || {};
  const item = lesson.skills.speaking[index];
  const p = LP(lesson.id);
  const min = Number(item.minScore) || SETTINGS.speakingMinScore;
  st.phase = 'result';
  st.mode = result.mode;
  st.error = result.error || null;
  st.seconds = result.seconds || 0;
  st.result = null;
  if (result.clipUrl) { st.clipUrl = result.clipUrl; st.heardSelf = false; }
  if (!st.error && result.mode === 'asr') {
    let best = null;
    (result.transcripts || []).forEach((transcript) => {
      const aligned = alignSpeech(item.text, transcript);
      if (!best || aligned.score > best.score) best = Object.assign(aligned, { transcript });
    });
    st.result = best;
    const previous = p.speaking[index];
    const top = Math.max(best.score, (previous && previous.score) || 0);
    if (best.score >= min) p.speaking[index] = { passed: true, score: top, mode: 'asr' };   // đạt từ 80% trở lên
    else if (!speakingPassed(previous)) p.speaking[index] = { passed: false, score: top, mode: 'asr' };
  } else if (!st.error && result.mode === 'record') {
    st.recorded = st.seconds >= SETTINGS.minRecordSeconds && !!result.clipUrl;
    if (!st.recorded) st.error = 'short';
    else confirmSelfSpeaking(lesson, index);
  }
  App.progressChanged(lesson.id);
  if (ui.lessonId === lesson.id && ui.tab === 'speaking') App.renderPanel();
}

// Chế độ dự phòng (không có nhận diện giọng nói): thu âm đủ dài + nghe mẫu + nghe lại giọng mình = hoàn thành câu.
function confirmSelfSpeaking(lesson, index) {
  const st = ui.sp[index];
  if (!st || st.mode !== 'record' || !st.recorded || !st.heardSelf || !st.heardSample) return;
  const p = LP(lesson.id);
  if (p.speaking[index] && p.speaking[index].passed) return;
  p.speaking[index] = { passed: true, score: null, mode: 'self' };
  App.progressChanged(lesson.id);
}

async function submitPasswordChange(form) {
  const oldField = $('#me-old');
  const newField = $('#me-new');
  const error = $('#me-password-error');
  const button = form.querySelector('button[type="submit"]');
  const fail = (reason, field) => {
    error.hidden = false;
    error.textContent = reason === 'invalid' ? 'Mật khẩu hiện tại chưa đúng' : Account.message(reason);
    shakeNode(form);
    field.focus();
  };
  if (!oldField.value) { fail('invalid', oldField); return; }
  if (newField.value.length < 6) { fail('password', newField); return; }
  button.disabled = true;
  const result = await Account.changePassword(oldField.value, newField.value);
  button.disabled = false;
  if (!form.isConnected) return;
  if (result.ok) {
    ui.mePassword = false;
    Modal.me();
    toast('Đã đổi mật khẩu', 'ok');
  } else if (result.reason === 'session') {
    App.sessionLost();
  } else {
    fail(result.reason, result.reason === 'password' ? newField : oldField);
  }
}

/* ---------- Gắn sự kiện toàn trang ---------- */
function bindGlobalEvents() {
  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (target) {
      if (target.getAttribute('aria-disabled') === 'true' || target.disabled) return;
      const handler = Actions[target.dataset.action] || BuilderActions[target.dataset.action];
      if (handler) handler(target, event);
      return;
    }
    if (event.target === $('#modal')) Modal.close();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') Modal.close();
    if (event.key !== 'Enter') return;
    const target = event.target;
    if (target.id === 'write-input') {
      event.preventDefault();
      Actions['write-check']({ dataset: { index: target.dataset.index } });
    } else if (target.dataset && target.dataset.fill) {
      event.preventDefault();
      const [scope, index] = target.dataset.fill.split(':');
      checkFill(currentLesson(), scope, Number(index));
    }
  });
  document.addEventListener('input', (event) => {
    const target = event.target;
    if (target.dataset && target.dataset.draft) ui.drafts[target.dataset.draft] = target.value;
    if (target.dataset && target.dataset.testInput && ui.test && !ui.test.submitted) ui.test.ans[target.dataset.testInput] = target.value;
    if (target.dataset && target.dataset.fill && ui.fill[target.dataset.fill]) ui.fill[target.dataset.fill].values[Number(target.dataset.b)] = target.value;
    if (target.id && target.id.indexOf('gate-') === 0) $('#gate-error').hidden = true;
  });
  document.addEventListener('change', (event) => {
    const target = event.target;
    if (!target.dataset || !target.dataset.task) return;
    const lesson = currentLesson();
    const p = LP(lesson.id);
    if (target.checked) addUnique(p.tasks, target.dataset.task);

const TEST_PASS = 5;      // điểm đạt (thang 10)

const testMinutes = (test) => Number(test && test.minutes) || TEST_MINUTES;
const mmss = (ms) => { const sec = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; };

const testList = () => (Array.isArray(APP_CONFIG.tests) ? APP_CONFIG.tests : []);
const getTest = (id) => testList().find((t) => t.id === id) || null;
const testAfterLesson = (number) => testList().find((t) => Array.isArray(t.range) && Number(t.range[1]) === number) || null;
function testLessons(test) {
  const [from, to] = test.range || [1, 0];
  const list = [];
  for (let n = Number(from); n <= Number(to); n++) list.push(APP_CONFIG.lessons[n - 1] || null);
  return list;
}
function userTests() {
  const up = userProgress();
  if (!up.tests || typeof up.tests !== 'object') up.tests = {};
  return up.tests;
}
// 'open' · 'locked' (chưa học xong 5 bài) · 'plan' (ngoài gói học) · 'soon' (bài chưa có video)
function testAccess(test) {
  if (isTeacher()) return 'open';
  const lessons = testLessons(test);
  if (!lessons.length || lessons.some((l) => !l)) return 'soon';
  const access = lessons.map((l) => lessonAccess(l));
  if (access.includes('plan')) return 'plan';
  if (access.includes('soon')) return 'soon';
  if (!lessons.every((l) => LP(l.id).done || checkLessonUnlock(l.id))) return 'locked';
  const record = userTests()[test.id];
  if (record && record.redo && !skillsRedone(test)) return 'redo';
  return 'open';
}
// Dưới điểm đạt: phải làm lại Nghe – Nói – Đọc – Viết của 5 bài thì mới được thi lại.
const SKILL_PARTS = ['listeningDone', 'speakingDone', 'readingDone', 'writingDone'];
function skillsRedone(test) {
  return testLessons(test).every((l) => l && SKILL_PARTS.every((k) => lessonStatus(l).skills[k]));
}
// Bài kiểm tra chưa đạt (và chưa làm lại kỹ năng) nằm trước bài số lessonNumber: chặn học tiếp.
function testBlocking(lessonNumber) {
  if (isTeacher() || !store.session) return null;
  const record = userTests();
  return testList().find((t) => Array.isArray(t.range) && Number(t.range[1]) < lessonNumber && record[t.id] && record[t.id].redo && !skillsRedone(t)) || null;
}
function firstRedoLesson(test) {
  return testLessons(test).find((l) => l && !SKILL_PARTS.every((k) => lessonStatus(l).skills[k])) || testLessons(test)[0];
}
// Xóa kết quả 4 kỹ năng của các bài thuộc bài kiểm tra chưa đạt (làm khi học viên rời trang kết quả).
function applyTestRedo(keepId) {
  const record = userTests();
  let changed = false;
  testList().forEach((test) => {
    const r = record[test.id];
    if (!r || !r.redo || r.cleared) return;
    if (keepId && keepId === test.id) return;   // còn đang xem kết quả bài này
    testLessons(test).forEach((l) => {
      if (!l) return;
      const p = LP(l.id);
      p.listening = []; p.speaking = {}; p.reading = []; p.writing = [];
    });
    r.cleared = true;
    if (ui.test && ui.test.id === test.id) ui.test = null;   // lần thi sau bắt đầu lại từ đầu

function processScore(test) {
  const scores = [];
  testLessons(test).forEach((lesson) => {
    if (!lesson) return;
    const p = LP(lesson.id);
    lesson.skills.speaking.forEach((_, i) => {

      else if (speakingPassed(entry)) scores.push(8);

}

      if (t.submitted) {
        const right = section.items.filter((_, i) => this.isCorrect(test, s, i)).length;
        got = `<span class="text-xs font-semibold tabular-nums ${right === section.items.length ? 'text-emerald-600' : 'text-ink-2'}">${right}/${section.items.length}</span>`;
      }
      return `<section class="flex flex-col gap-4">
        <h3 class="flex items-center gap-2 font-semibold"><span class="size-7 shrink-0 grid place-items-center rounded-lg bg-brand-soft text-brand text-xs font-bold">${roman[s]}</span><span class="flex-1">${esc(section.title)}</span><span class="text-xs font-medium text-ink-3 tabular-nums">${fmt(section.points)}đ</span>${got}</h3>
        ${passage}${body}
      </section>`;
    }).join('<hr class="border-line">');
    const pass = sum.score >= TEST_PASS;
    const head = t.submitted
      ? `<div class="flex flex-wrap items-center gap-4 p-4 rounded-2xl ${pass ? 'bg-emerald-50' : 'bg-rose-50'}">
          <div class="flex items-baseline gap-1"><span class="text-4xl font-bold tabular-nums ${pass ? 'text-emerald-600' : 'text-rose-600'}">${fmt(sum.score)}</span><span class="text-ink-2 font-semibold">/10</span></div>
          <div class="flex-1 min-w-40">
            <p class="font-semibold ${pass ? 'text-emerald-700' : 'text-rose-600'}">${pass ? 'Đạt' : 'Chưa đạt'}</p>
            <p class="text-sm text-ink-2 tabular-nums">${sum.right}/${sum.count} câu đúng${t.usedMs ? ` · ${t.timeUp ? 'Hết giờ' : `Làm trong ${mmss(t.usedMs)}`}` : ''}${record ? ` · Cao nhất ${fmt(record.best)}` : ''}</p>
          </div>
          ${pass || isTeacher()
            ? `<button type="button" data-action="test-retry" class="h-10 px-4 rounded-xl bg-brand text-white text-sm font-semibold inline-flex items-center gap-1.5 hover:bg-brand-dark">${icon('rotate-ccw')}Làm lại</button>`
            : `<button type="button" data-action="open-lesson" data-id="${esc(testLessons(test)[0].id)}" class="h-10 px-4 rounded-xl bg-brand text-white text-sm font-semibold inline-flex items-center gap-1.5 hover:bg-brand-dark">${icon('history')}Ôn lại kỹ năng</button>`}
          <button type="button" data-action="test-board" data-test="${esc(test.id)}" aria-label="Bảng xếp hạng" title="Bảng xếp hạng" class="h-10 px-3 rounded-xl border border-amber-300 bg-surface text-gold text-sm font-semibold inline-flex items-center gap-1.5 hover:bg-amber-50">${icon('trophy')}Xếp hạng</button>
          ${pass || isTeacher() ? '' : `<p class="basis-full text-sm text-rose-600">Làm lại Nghe, Nói, Đọc, Viết của Bài ${test.range[0]} – ${test.range[1]} rồi mới được thi lại.</p>`}
        </div>`
      : '';
    const submit = t.submitted ? '' : `<div class="flex flex-wrap items-center justify-end gap-3 pt-2">
        ${t.armed && sum.answered < sum.count ? `<span class="text-sm text-gold font-medium" role="alert">Còn ${sum.count - sum.answered} câu chưa làm</span>` : ''}
        <button type="button" data-action="test-submit" class="h-11 px-5 rounded-xl bg-brand text-white font-semibold inline-flex items-center gap-2 hover:bg-brand-dark">${icon('send')}${t.armed && sum.answered < sum.count ? 'Vẫn nộp bài' : 'Nộp bài'}</button>
      </div>`;
    const left = this.remaining();
    const live = t.submitted ? '' : `<span class="text-sm font-semibold tabular-nums text-ink-2">${sum.answered}/${sum.count}</span>
        <span class="${this.timerTone(left)}" role="timer" aria-label="Thời gian còn lại">${icon('clock', 'size-4')}<span id="test-timer">${mmss(left)}</span></span>`;
    panel.innerHTML = `<div class="p-4 sm:p-6 pt-0 sm:pt-0 w-full max-w-3xl mx-auto flex flex-col gap-6">
      <div class="${t.submitted ? 'pt-4 sm:pt-6' : 'sticky top-0 z-10 -mx-4 sm:-mx-6 px-4 sm:px-6 pt-4 sm:pt-6 pb-3 bg-surface border-b border-line'}">${titleRow(live)}</div>
      ${head}${sections}${submit}
    </div>`;
  }
};

/* ----- Thao tác trong bài kiểm tra ----- */
Object.assign(Actions, {
  'open-test'(button) { Tests.open(button.dataset.test); },
  'test-pick'(button) {
    if (!ui.test || ui.test.submitted || !ui.test.startedAt) return;
    ui.test.ans[button.dataset.key] = Number(button.dataset.i);
    ui.test.armed = false;
    Tests.render();
  },
  'test-tile'(button) {
    const state = ui.test && ui.test.order[button.dataset.key];
    if (!state || ui.test.submitted) return;
    const w = Number(button.dataset.w);
    if (!state.picked.includes(w)) state.picked.push(w);
    ui.test.armed = false;
    Tests.render();
  },
  'test-unpick'(button) {
    const state = ui.test && ui.test.order[button.dataset.key];
    if (!state || ui.test.submitted) return;
    state.picked.splice(Number(button.dataset.pos), 1);
    Tests.render();
  },
  'test-order-reset'(button) {
    const state = ui.test && ui.test.order[button.dataset.key];
    if (!state || ui.test.submitted) return;
    state.picked = [];
    Tests.render();
  },
  'test-submit'() {
    const test = getTest(ui.testId);
    if (!test || ui.test.submitted) return;
    const sum = Tests.tally(test);
    if (sum.answered < sum.count && !ui.test.armed) { ui.test.armed = true; Tests.render(); return; }
    Tests.finish(test, false);
  },
  'test-start'() { Tests.start(); },
  'test-credit'(button) {
    const test = getTest(ui.testId);
    if (!test || !ui.test.submitted) return;
    const key = button.dataset.key;
    if (ui.test.credit[key]) delete ui.test.credit[key];
    else ui.test.credit[key] = true;
    Tests.save(test);
    Tests.render();
    App.renderSidebar();
  },
  'test-retry'() {
    const id = ui.testId;
    ui.test = { id, ans: {}, order: {}, credit: {}, submitted: false, armed: false, startedAt: 0 };
    Tests.render();
    $('#panel').scrollTop = 0;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

/* ----- Mục kiểm tra trên lộ trình (sau bài thứ 5, 10, 15…) ----- */
function testSidebarItem(lessonNumber) {
  const test = testAfterLesson(lessonNumber);
  if (!test) return '';
  const access = testAccess(test);
  const record = userTests()[test.id];
  const active = ui.testId === test.id;
  const fmt = (x) => String(Math.round(x * 10) / 10).replace('.', ',');
  const passed = record && record.best >= TEST_PASS;
  const badge = access === 'redo' ? icon('rotate-ccw', 'size-4') : access === 'open' ? (passed ? icon('check', 'size-4') : icon('flag', 'size-4')) : access === 'plan' ? icon('crown', 'size-4') : access === 'soon' ? icon('clock', 'size-4') : icon('lock', 'size-4');
  const tone = access === 'redo' ? 'bg-rose-50 text-rose-600' : access !== 'open' ? 'bg-paper text-ink-3' : passed ? 'bg-emerald-500 text-white' : active ? 'bg-gold text-white' : 'bg-amber-50 text-gold';
  const state = access === 'redo' ? `Ôn lại kỹ năng Bài ${test.range[0]} – ${test.range[1]}` : access === 'locked' ? `Hoàn thành Bài ${test.range[0]} – ${test.range[1]}` : access === 'plan' ? 'Ngoài gói học' : access === 'soon' ? 'Sắp ra mắt' : record ? `Cao nhất ${fmt(record.best)}/10` : 'Chưa làm';
  return `<button type="button" data-action="open-test" data-test="${esc(test.id)}" ${active ? 'aria-current="true"' : ''} aria-label="${esc(test.title)} — ${esc(state)}"
    class="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-xl border border-dashed transition-colors ${active ? 'border-gold bg-amber-50' : 'border-amber-300/70 hover:border-gold'} ${access === 'open' ? '' : 'opacity-70'}">
    <span class="size-9 shrink-0 grid place-items-center rounded-lg ${tone}">${badge}</span>
    <span class="min-w-0 flex-1">
      <span class="block font-medium leading-tight">${esc(test.title)}</span>
      <span class="block mt-0.5 text-xs ${passed ? 'text-emerald-600 font-semibold' : 'text-ink-2'} tabular-nums">${esc(state)}</span>
    </span>
  </button>`;
}

/* ----- Điểm kiểm tra trong bảng tiến trình ----- */
function testScoresHtml() {
  const record = userTests();
  const chips = testList().map((test) => {
    const r = record[test.id];
    const fmt = (x) => String(Math.round(x * 10) / 10).replace('.', ',');
    const tone = !r ? 'bg-paper text-ink-3' : r.best >= TEST_PASS ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-600';
    return `<span title="${esc(test.title)} · ${esc(test.subtitle || '')}" class="h-8 px-2.5 rounded-lg inline-flex items-center gap-1.5 text-xs font-semibold tabular-nums ${tone}">${icon('flag', 'size-3.5')}${esc(test.title.replace('Kiểm tra ', 'KT'))}<span>${r ? fmt(r.best) : '–'}</span></span>`;
  }).join('');
  return chips ? `<div class="mt-3 flex flex-wrap gap-1.5">${chips}</div>` : '';
}

/* 13. BẢNG XẾP HẠNG                                                            */
/* ========================================================================== */
// Tháng (giờ Việt Nam) của một mốc ISO: "2026-11" — giống monthOf_ trong Code.gs.
const monthOf = (iso) => { const t = Date.parse(String(iso || '')); return isNaN(t) ? '' : new Date(t + 7 * 3600000).toISOString().slice(0, 7); };
const thisMonth = () => monthOf(new Date().toISOString());
const shiftMonth = (m, d) => { const [y, mo] = m.split('-').map(Number); const t = new Date(Date.UTC(y, mo - 1 + d, 1)); return t.toISOString().slice(0, 7); };
const monthLabel = (m) => `Tháng ${Number(m.slice(5))}/${m.slice(0, 4)}`;
const FIRST_MONTH = '2026-11';   // tháng bắt đầu đua

const Board = {
  rows: null,       // dữ liệu lấy từ máy chủ
  loadedAt: 0,
  loading: false,
  failed: false,
  tab: 'month',     // month (tiến trình trong tháng) · total (từ đầu khóa) · kt-1…
  month: '',

  // Khi chạy thử không có máy chủ: chỉ có tiến trình của chính mình.
  localRows() {
    const up = userProgress();
    const tests = {};
    Object.keys(up.tests || {}).forEach((id) => { const f = up.tests[id] && up.tests[id].first; if (f) tests[id] = f; });
    const ml = {}, md = {};
    Object.values(up.lessons).forEach((p) => { if (p && p.done && p.doneAt) { const m = monthOf(p.doneAt); if (m) ml[m] = (ml[m] || 0) + 1; } });
    up.days.forEach((d) => { const m = String(d).slice(0, 7); md[m] = (md[m] || 0) + 1; });
    return [{ name: (store.session && store.session.name) || 'Tôi', me: true, lessons: Object.values(up.lessons).filter((p) => p && p.done).length, days: up.days.length, ml, md, tests }];
  },
  async load(force) {
    if (this.loading) return;
    if (!force && this.rows && Date.now() - this.loadedAt < 60000) return;
    if (!Api.remote()) { this.rows = this.localRows(); this.loadedAt = Date.now(); return; }
    this.loading = true;
    this.failed = false;
    try {
      const result = await Api.call({ action: 'board', email: store.session.email, token: store.session.token });
      if (result && result.ok && Array.isArray(result.rows)) { this.rows = result.rows; this.prizes = result.prizes || {}; this.loadedAt = Date.now(); }
      else if (result && result.reason === 'session') { this.loading = false; Modal.close(); App.sessionLost(); return; }
      else this.failed = true;
    } catch (err) {
      this.failed = true;
    }
    this.loading = false;
  },
  // Gộp điểm mới nhất của chính mình (có thể chưa kịp lưu lên máy chủ).
  merged() {
    const rows = (this.rows || []).map((r) => Object.assign({}, r));
    const mine = this.localRows()[0];
    const me = rows.find((r) => r.me);
    if (me) {
      me.lessons = Math.max(me.lessons || 0, mine.lessons); me.days = Math.max(me.days || 0, mine.days); me.tests = Object.assign({}, me.tests || {}, mine.tests);
      const maxMap = (a, b) => { const out = Object.assign({}, a || {}); Object.keys(b || {}).forEach((k) => { out[k] = Math.max(out[k] || 0, b[k]); }); return out; };
      me.ml = maxMap(me.ml, mine.ml); me.md = maxMap(me.md, mine.md);
    }
    else if (!isTeacher()) rows.push(mine);
    return rows;
  },
  ranked(tab) {
    const rows = this.merged();
    const m = this.month;
    if (tab === 'month') {
      const L = (r) => (r.ml && r.ml[m]) || 0, D = (r) => (r.md && r.md[m]) || 0;
      return rows.filter((r) => L(r) > 0 || D(r) > 0)
        .sort((a, b) => (L(b) - L(a)) || (D(b) - D(a)) || String(a.name).localeCompare(String(b.name), 'vi'));
    }
    if (tab === 'total') {
      const total = (r) => Object.values(r.tests || {}).reduce((a, f) => a + (Number(f.s) || 0), 0);
      return rows.filter((r) => r.lessons > 0 || r.days > 0)
        .sort((a, b) => (b.lessons - a.lessons) || (total(b) - total(a)) || (b.days - a.days) || String(a.name).localeCompare(String(b.name), 'vi'));
    }
    return rows.filter((r) => !r.free && r.tests && r.tests[tab] && monthOf(r.tests[tab].at) === m)
      .sort((a, b) => {
        const x = a.tests[tab], y = b.tests[tab];
        return (prizeTotal(y) - prizeTotal(x)) || (y.s - x.s) || ((x.t || 9e9) - (y.t || 9e9)) || String(x.at).localeCompare(String(y.at));
      });
  },
  async open(tab) {
    if (!store.session) return;
    if (tab) this.tab = tab;
    this.month = thisMonth();
    this.claim = null;
    Modal.open(this.html(), true);
    await this.load(false);
    if (!$('#modal').hidden && $('#board')) this.refresh();
  },
  refresh() {
    const card = $('#modal-card');
    const top = card.scrollTop;
    card.innerHTML = this.html();
    card.scrollTop = top;
  },
  claimHtml() {
    const c = this.claim;
    const test = getTest(c.test);
    const option = (value, ic, label) => `<button type="button" data-action="claim-method" data-v="${value}" aria-pressed="${c.method === value}" class="h-14 rounded-xl border-2 font-semibold inline-flex items-center justify-center gap-2 ${c.method === value ? 'border-brand bg-brand-soft text-brand' : 'border-line hover:border-brand'}">${icon(ic, 'size-5')}${label}</button>`;
    const upload = c.method === 'bank'
      ? `<label class="flex flex-col items-center justify-center gap-2 min-h-40 p-3 rounded-xl border-2 border-dashed ${c.image ? 'border-emerald-400' : 'border-line hover:border-brand'} cursor-pointer text-sm text-ink-2">
          ${c.image ? `<img src="data:image/jpeg;base64,${c.image}" alt="Mã QR" class="max-h-56 rounded-lg">` : `${icon('upload', 'size-6')}<span>Ảnh mã QR ngân hàng của bạn</span>`}
          <input id="claim-file" type="file" accept="image/*" class="sr-only">
        </label>`
      : '';
    const ready = c.method === 'cash' || (c.method === 'bank' && c.image);
    return `<div class="flex flex-col gap-3">
      <p class="font-semibold">${esc(test ? test.title : '')} · ${monthLabel(c.month)} · ${esc(APP_CONFIG.testPrize || '')}</p>
      <div class="grid grid-cols-2 gap-2">${option('cash', 'party', 'Tiền mặt')}${option('bank', 'send', 'Chuyển khoản')}</div>
      ${upload}
      ${c.error ? `<p role="alert" class="text-sm text-rose-600">${esc(c.error)}</p>` : ''}
      <div class="flex justify-end gap-2">
        <button type="button" data-action="claim-cancel" class="h-10 px-4 rounded-xl border border-line text-sm font-medium hover:border-brand hover:text-brand">Hủy</button>
        <button type="button" data-action="claim-send" ${ready && !c.sending ? '' : 'disabled'} class="h-10 px-4 rounded-xl bg-brand text-white text-sm font-semibold inline-flex items-center gap-1.5 hover:bg-brand-dark disabled:opacity-50">${icon(c.sending ? 'loader' : 'send', c.sending ? 'size-4 spin' : 'size-4')}Gửi</button>
      </div>
    </div>`;
  },
  html() {
    const fmt = (x) => String(Math.round(x * 10) / 10).replace('.', ',');
    const tabs = [{ id: 'month', label: 'Tháng này' }, { id: 'total', label: 'Tổng' }].concat(testList().map((t) => ({ id: t.id, label: t.title.replace('Kiểm tra ', 'KT') })));
    const tabBar = `<div role="tablist" aria-label="Bảng xếp hạng" class="mt-4 flex gap-1 overflow-x-auto scroll-thin pb-1">${tabs.map((t) => {
      const on = this.tab === t.id;
      const label = t.id === 'month' && this.month !== thisMonth() ? 'Tháng' : t.label;
      return `<button type="button" role="tab" aria-selected="${on}" data-action="board-tab" data-tab="${t.id}" class="shrink-0 h-9 px-3 rounded-lg text-sm font-semibold ${on ? 'bg-brand text-white' : 'bg-paper text-ink-2 hover:text-brand'}">${esc(label)}</button>`;
    }).join('')}</div>`;
    const test = getTest(this.tab);
    const now = thisMonth();
    const closed = this.month < now;
    const nav = this.tab === 'total' || this.claim ? '' : `<div class="mt-3 flex items-center gap-2">
      <button type="button" data-action="board-month" data-d="-1" ${this.month <= FIRST_MONTH ? 'disabled' : ''} aria-label="Tháng trước" class="size-9 grid place-items-center rounded-lg border border-line text-ink-2 hover:border-brand hover:text-brand disabled:opacity-40">${icon('chevron-left', 'size-4')}</button>
      <span class="min-w-32 text-center font-semibold tabular-nums">${monthLabel(this.month)}</span>
      <button type="button" data-action="board-month" data-d="1" ${this.month >= now ? 'disabled' : ''} aria-label="Tháng sau" class="size-9 grid place-items-center rounded-lg border border-line text-ink-2 hover:border-brand hover:text-brand disabled:opacity-40">${icon('chevron-right', 'size-4')}</button>
      <span class="ml-auto h-7 px-2.5 rounded-full text-xs font-semibold inline-flex items-center ${closed ? 'bg-paper text-ink-2' : 'bg-emerald-50 text-emerald-700'}">${closed ? 'Đã chốt' : 'Đang đua'}</span>
    </div>`;
    let body;
    if (this.claim) body = this.claimHtml();
    else if (!this.rows && (this.loading || !this.failed)) {
      body = `<div class="py-10 grid place-items-center text-brand">${icon('loader', 'size-6 spin')}</div>`;
    } else if (!this.rows) {
      body = `<div class="py-8 flex flex-col items-center gap-3 text-sm text-ink-2">${icon('cloud-off', 'size-6 text-rose-600')}<span>Chưa tải được bảng xếp hạng</span><button type="button" data-action="board-reload" class="h-9 px-3 rounded-lg border border-line font-medium hover:border-brand hover:text-brand">Thử lại</button></div>`;
    } else {
      const list = this.ranked(this.tab);
      const medal = (n) => n === 1 ? 'bg-amber-400 text-white' : n === 2 ? 'bg-slate-300 text-slate-700' : n === 3 ? 'bg-orange-300 text-white' : 'bg-paper text-ink-2';
      const items = list.map((r, i) => {
        const n = i + 1;
        let value, sub = '';
        if (test) {
          const f = r.tests[this.tab];
          value = `<span class="text-lg font-bold tabular-nums text-ink">${fmt(prizeTotal(f))}</span>`;
          sub = `KT ${fmt(f.s)} · QT ${fmt(Number(f.p) || 0)}${f.t ? ` · ${mmss(f.t)}` : ''}`;
        } else if (this.tab === 'month') {
          value = `<span class="text-lg font-bold tabular-nums">${(r.ml && r.ml[this.month]) || 0}</span><span class="text-xs text-ink-2"> bài</span>`;
          sub = `${(r.md && r.md[this.month]) || 0} ngày học`;
        } else {
          const tests = Object.keys(r.tests || {}).length;
          value = `<span class="text-lg font-bold tabular-nums">${r.lessons}</span><span class="text-xs text-ink-2"> bài</span>`;
          sub = `${r.days} ngày học${tests ? ` · ${tests} bài KT` : ''}`;
        }
        const claim = test && this.prizes && this.prizes[`${this.tab}@${this.month}`];
        const isWinner = test && (claim ? (claim.email ? claim.email === r.email : claim.me ? !!r.me : !r.me && claim.name === r.name) : n === 1);
        let prize = isWinner && APP_CONFIG.testPrize ? `<span class="shrink-0 h-6 px-2 rounded-full bg-amber-50 text-gold text-xs font-bold inline-flex items-center gap-1">${icon('trophy', 'size-3.5')}${esc(APP_CONFIG.testPrize)}${claim ? ` · Đã nhận${claim.method ? (claim.method === 'bank' ? ' (CK)' : ' (TM)') : ''}` : ''}</span>` : '';
        if (isWinner && !claim && r.me && n === 1 && closed && Api.remote()) prize += `<button type="button" data-action="claim-open" class="shrink-0 h-7 px-2.5 rounded-lg bg-gold text-white text-xs font-semibold hover:opacity-90">Nhận thưởng</button>`;
        return `<li class="flex items-center gap-3 px-3 py-2.5 rounded-xl ${r.me ? 'bg-brand-soft' : ''}">
          <span class="size-8 shrink-0 grid place-items-center rounded-full text-sm font-bold tabular-nums ${medal(n)}">${n}</span>
          <span class="min-w-0 flex-1">
            <span class="flex flex-wrap items-center gap-x-2 gap-y-1"><span class="font-medium truncate">${esc(r.name || '—')}</span>${r.me ? '<span class="shrink-0 text-xs font-semibold text-brand">Bạn</span>' : ''}${prize}</span>
            ${r.email || sub ? `<span class="block text-xs text-ink-2 truncate">${[sub, r.email ? esc(r.email) : ''].filter(Boolean).join(' · ')}</span>` : ''}
          </span>
          <span class="shrink-0 text-right">${value}</span>
        </li>`;
      }).join('');
      const note = test
        ? `<p class="flex items-center gap-2 text-sm text-ink-2">${icon('trophy', 'size-4 text-gold')}<span>Hạng 1 tháng nhận <b class="text-gold">${esc(APP_CONFIG.testPrize || '')}</b>${closed ? '' : ', nhận từ ngày 1 tháng sau'} · Chỉ tính người làm bài lần đầu trong tháng. Điểm = (Quá trình + Kiểm tra × 2) ÷ 3; Kiểm tra: điểm máy chấm; Quá trình: điểm Nói trung bình 5 bài.</span></p>`
        : '';
      body = `${note}${items ? `<ol class="mt-2 flex flex-col gap-1">${items}</ol>` : `<p class="py-8 text-center text-sm text-ink-3">Chưa có ai</p>`}`;
    }
    return `<div id="board">
      <div class="flex items-center gap-3">

        <button type="button" data-action="modal-close" aria-label="Đóng" class="size-9 -mr-1 grid place-items-center rounded-lg text-ink-3 hover:bg-paper hover:text-ink">${icon('x', 'size-5')}</button>
      </div>
      ${tabBar}${nav}
      <div class="mt-3">${body}</div>
    </div>`;
  }
};

Object.assign(Actions, {
  board() { Board.open(); },
  'board-tab'(button) { Board.tab = button.dataset.tab; Board.claim = null; Board.refresh(); },
  async 'board-reload'() { const p = Board.load(true); Board.refresh(); await p; if ($('#board')) Board.refresh(); },
  'test-board'(button) { Board.open(button.dataset.test); },
  'board-month'(button) { const next = shiftMonth(Board.month, Number(button.dataset.d)); if (next >= FIRST_MONTH && next <= thisMonth()) { Board.month = next; Board.claim = null; Board.refresh(); } },
  'claim-open'() { Board.claim = { test: Board.tab, month: Board.month, method: '', image: '', error: '' }; Board.refresh(); },
  'claim-cancel'() { Board.claim = null; Board.refresh(); },
  'claim-method'(button) { Board.claim.method = button.dataset.v; Board.claim.error = ''; Board.refresh(); },
  async 'claim-send'() {
    const c = Board.claim;
    if (!c || c.sending) return;
    c.sending = true; c.error = ''; Board.refresh();
    let result;
    try {
      result = await Api.call({ action: 'prize', email: store.session.email, token: store.session.token, test: c.test, month: c.month, method: c.method, image: c.method === 'bank' ? c.image : '' }, 60000);
    } catch (err) { result = { ok: false, reason: 'network' }; }
    c.sending = false;
    if (result && result.ok) {
      Board.claim = null;
      toast('Đã gửi yêu cầu nhận thưởng cho giáo viên', 'ok', 4200);
      confettiBurst();
      await Board.load(true);
    } else if (result && result.reason === 'session') { Modal.close(); App.sessionLost(); return; }
    else {
      c.error = {
        'not-first': 'Bạn không còn đứng hạng 1 ở bài này.',
        claimed: 'Giải của bài này đã có người nhận.',
        'claimed-me': 'Bạn đã gửi yêu cầu nhận thưởng rồi.',
        image: 'Ảnh không hợp lệ, chọn lại ảnh mã QR.',
        open: 'Tháng này chưa kết thúc, chờ đến ngày 1 tháng sau nhé.',
        inactive: 'Tài khoản đang hết hạn, gia hạn rồi nhận thưởng nhé.',
        unknown: 'Máy chủ chưa được cập nhật (Code.gs). Báo giáo viên nhé.'
      }[result && result.reason] || 'Chưa gửi được, thử lại sau ít phút.';
    }
    if ($('#board')) Board.refresh();
  }
});

// Đọc ảnh mã QR, thu nhỏ còn tối đa 1000px rồi nén JPEG để gửi qua email.
async function readClaimImage(file) {
  if (!file || !/^image\//.test(file.type)) return '';
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = url; });
    const scale = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.85).split(',')[1] || '';
  } catch (err) {
    return '';
  } finally {
    URL.revokeObjectURL(url);
  }
}
document.addEventListener('change', async (event) => {
  if (event.target.id !== 'claim-file' || !Board.claim) return;
  const data = await readClaimImage(event.target.files && event.target.files[0]);
  if (!Board.claim) return;
  Board.claim.image = data;
  Board.claim.error = data ? '' : 'Không đọc được ảnh, chọn ảnh khác.';
  if ($('#board')) Board.refresh();
});

  /* ----- Xem thử media và lấy thời điểm ----- */
  stopMedia() {
    clearInterval(this.clock);
    const video = $('#b-media');
    if (video) { video.pause(); video.removeAttribute('src'); video.load(); video.hidden = true; }
    if (this.yt) { try { this.yt.destroy(); } catch (err) { /* bỏ qua */ } this.yt = null; }
    const holder = $('#b-yt');
    if (holder) { holder.innerHTML = ''; holder.hidden = true; }
  },
  loadMedia() {
    this.stopMedia();
    const s = this.state;
    const source = Player.resolveMedia(s.localUrl || s.lesson.videoUrl);
    const video = $('#b-media');
    const holder = $('#b-yt');
    $('#b-empty').hidden = source.kind !== 'none';
    if (source.kind === 'youtube') {
      holder.hidden = false;
      holder.innerHTML = '<div id="b-yt-frame"></div>';
      Player.loadYouTubeApi().then(() => {
        if (ui.view !== 'builder' || !$('#b-yt-frame')) return;
        this.yt = new window.YT.Player('b-yt-frame', { width: '100%', height: '100%', videoId: source.id, playerVars: { rel: 0, playsinline: 1 } });
      }).catch(() => toast('Không tải được YouTube', 'err'));
    } else if (source.kind !== 'none') {
      video.hidden = false;
      video.src = source.src;
      video.load();
    }
    this.clock = setInterval(() => {
      const label = $('#b-now');
      if (label) label.textContent = this.stamp(this.now());
    }, 200);
  },
  now() {
    if (this.yt && this.yt.getCurrentTime) return this.yt.getCurrentTime() || 0;
    const video = $('#b-media');
    return video && !video.hidden ? video.currentTime || 0 : 0;
  },
  seek(time, play) {
    if (this.yt && this.yt.seekTo) { this.yt.seekTo(time, true); if (play) this.yt.playVideo(); return; }
    const video = $('#b-media');
    if (video && !video.hidden) { video.currentTime = time; if (play) video.play().catch(() => {}); }
  },
  stamp(seconds) {
    const tenth = Math.round((seconds || 0) * 10) / 10;
    return fmtTime(tenth) + '.' + Math.round((tenth % 1) * 10);
  },

  // Mốc có thời điểm cụ thể xếp trước theo thứ tự thời gian; mốc tự chia giữ nguyên thứ tự phía sau.
  sortCheckpoints() {
    const list = this.state.lesson.checkpoints;
    this.state.lesson.checkpoints = list.filter((cp) => !cp.auto).sort((a, b) => a.time - b.time).concat(list.filter((cp) => cp.auto));
  },

  /* ----- Xuất JSON ----- */
  buildLesson() {
    const s = this.state;
    const l = s.lesson;
    let extra = null;
    try {
      extra = JSON.parse(s.extra || '{}');
      if (!extra || typeof extra !== 'object' || Array.isArray(extra)) throw new Error('Cần một đối tượng { … }');
      s.extraError = null;
    } catch (err) {
      s.extraError = err.message;
    }
    const lesson = {
      id: l.id.trim() || 'bai-moi',
      title: l.title.trim(),
      subtitle: l.subtitle.trim(),
      lang: l.lang,
      unlocked: !!l.unlocked,
      videoUrl: l.videoUrl.trim() || (s.localName ? 'media/' + s.localName : ''),
      cover: l.cover.trim(),
      checkpoints: (() => {
        const ordered = l.checkpoints.filter((cp) => !cp.auto).sort((a, b) => a.time - b.time).concat(l.checkpoints.filter((cp) => cp.auto));
        const used = new Set();
        return ordered.map((cp) => {
          const kept = cp.options.map((text, k) => ({ text: String(text).trim(), k })).filter((x) => x.text);
          const correct = Math.max(0, kept.findIndex((x) => x.k === Number(cp.correct)));
          let id = String(cp.id || '').trim();
          for (let n = 1; !id || used.has(id); n++) id = `cp${n}`;   // giữ mã cũ để không mất tiến trình của học viên
          used.add(id);
          return { id, time: cp.auto ? 'auto' : Math.round((Number(cp.time) || 0) * 10) / 10, question: String(cp.question || '').trim(), options: kept.map((x) => x.text), correct, hint: String(cp.hint || '').trim() };
        });
      })()
    };
    const source = extra || {};
    lesson.skills = source.skills || {};
    lesson.reviewOld = source.reviewOld || {};
    lesson.previewNew = source.previewNew || {};
    lesson.tasks = source.tasks || [];
    return lesson;
  },
  buildConfig(lesson) {
    const config = JSON.parse(JSON.stringify(APP_CONFIG));
    config.lessons.forEach((item) => (item.checkpoints || []).forEach((cp) => {   // ghi lại mốc tự chia đúng dạng "auto"
      if (cp.auto) cp.time = 'auto';
      delete cp.auto;
    }));
    const at = config.lessons.findIndex((x) => x.id === this.state.sourceId || x.id === lesson.id);
    if (at >= 0) config.lessons[at] = lesson; else config.lessons.push(lesson);
    return config;
  },
  outputText() {
    const lesson = this.buildLesson();
    if (this.state.out === 'config') {
      return `/* ============================ APP_CONFIG: BẮT ĐẦU ============================ */\nconst APP_CONFIG = ${JSON.stringify(this.buildConfig(lesson), null, 2)};\n/* ============================ APP_CONFIG: KẾT THÚC ============================ */`;
    }
    return JSON.stringify(lesson, null, 2);
  },
  renderOutput() {
    const s = this.state;
    const out = $('#b-out');
    if (!out) return;
    out.value = this.outputText();
    ['lesson', 'config'].forEach((name) => {
      const tab = $('#b-out-' + name);
      const on = s.out === name;
      tab.setAttribute('aria-selected', String(on));
      tab.className = `h-8 px-3 rounded-lg text-sm font-medium ${on ? 'bg-surface text-brand shadow-sm' : 'text-ink-2'}`;
    });
    const badge = $('#b-extra-state');
    badge.textContent = s.extraError ? 'JSON lỗi: ' + s.extraError : 'JSON hợp lệ';
    badge.className = `text-xs font-semibold text-right ${s.extraError ? 'text-rose-600' : 'text-emerald-600'}`;
  },
  queueOutput() {
    clearTimeout(this.outTimer);
    this.outTimer = setTimeout(() => this.renderOutput(), 150);
  },

  /* ----- Nhập từ Excel: link video + mốc dừng cho bài đang soạn và các bài khác trong file ----- */
  async importFile(file) {
    let data;
    try {
      data = ContentTable.parse(Sheets.read(await file.arrayBuffer()));
    } catch (err) {
      toast(ContentTable.errorMessage(err), 'err', 5000);
      return;
    }
    const s = this.state;
    // Bài đang soạn (kể cả bài mới chưa lưu) thế chỗ bản đã lưu của chính nó; dòng không ghi mã bài thì tính cho bài này.
    const draft = { id: s.lesson.id, title: s.lesson.title, videoUrl: s.lesson.videoUrl, checkpoints: s.lesson.checkpoints.map((cp) => ({ id: cp.id, question: cp.question })) };
    const targets = APP_CONFIG.lessons.map((lesson) => (lesson.id === s.sourceId ? draft : lesson));
    if (!s.sourceId) targets.push(draft);
    const summary = ContentTable.apply(data, targets, draft);
    summary.touched.forEach((group, target) => {
      if (target === draft) {
        if (group.video != null) {
          s.lesson.videoUrl = draft.videoUrl;
          if (s.localUrl) { URL.revokeObjectURL(s.localUrl); s.localUrl = null; s.localName = ''; }
        }
        if (group.cps.length) s.lesson.checkpoints = draft.checkpoints.map((cp) => ({ id: cp.id, auto: cp.time === 'auto', time: cp.time === 'auto' ? null : cp.time, question: cp.question, options: cp.options.slice(), correct: cp.correct, hint: cp.hint || '' }));
      } else {
        normalizeLesson(target, APP_CONFIG.lessons.indexOf(target));
      }
    });
    this.sortCheckpoints();
    this.render();
    this.loadMedia();
    if (!summary.lessons) {
      toast('File không có dòng nào khớp với bài học', 'err', 5000);
    } else {
      toast(`Đã nhập ${summary.checkpoints} mốc dừng${summary.videos ? ' và ' + summary.videos + ' link video' : ''} cho ${summary.lessons} bài`, 'ok', 4500);
    }
    if (summary.unknown.length) toast(`Không tìm thấy bài: ${summary.unknown.slice(0, 4).join(', ')}`, 'warn', 6000);
    if (summary.warnings.length) toast(`${summary.warnings[0]}${summary.warnings.length > 1 ? ` (và ${summary.warnings.length - 1} dòng khác)` : ''}`, 'warn', 7000);
  },

  /* ----- Nhập liệu ----- */
  onInput(target) {
    const s = this.state;
    const kind = target.dataset.b;
    if (!kind || !s) return;
    const cp = target.dataset.i != null ? s.lesson.checkpoints[Number(target.dataset.i)] : null;
    if (kind === 'b-id') s.lesson.id = target.value;
    else if (kind === 'b-title') s.lesson.title = target.value;
    else if (kind === 'b-subtitle') s.lesson.subtitle = target.value;
    else if (kind === 'b-lang') s.lesson.lang = target.value;
    else if (kind === 'b-cover') s.lesson.cover = target.value;
    else if (kind === 'b-unlocked') s.lesson.unlocked = target.checked;
    else if (kind === 'b-url') s.lesson.videoUrl = target.value;
    else if (kind === 'b-extra') s.extra = target.value;
    else if (cp && kind === 'cp-time') { cp.auto = target.value === ''; cp.time = cp.auto ? null : Number(target.value) || 0; }
    else if (cp && kind === 'cp-question') cp.question = target.value;
    else if (cp && kind === 'cp-hint') cp.hint = target.value;
    else if (cp && kind === 'cp-option') cp.options[Number(target.dataset.k)] = target.value;
    else if (cp && kind === 'cp-correct') { cp.correct = Number(target.dataset.k); this.renderCheckpoints(); }
    this.queueOutput();
  },
  bind() {
    const root = $('#view-builder');
    root.addEventListener('input', (event) => this.onInput(event.target));
    root.addEventListener('change', (event) => {
      const target = event.target;
      if (target.id === 'b-load') {
        const picked = getLesson(target.value);
        if (picked) {
          this.state = this.fromLesson(picked);
        } else {
          const keepExtra = this.state.extra;
          this.state = { sourceId: null, lesson: this.blankLesson(), extra: keepExtra, extraError: null, out: this.state.out, localUrl: null, localName: '' };
        }
        this.render();
        this.loadMedia();
      } else if (target.id === 'b-xlsx') {
        const file = target.files && target.files[0];
        target.value = '';
        if (file) this.importFile(file);
      } else if (target.id === 'b-file') {
        const file = target.files && target.files[0];
        if (!file) return;
        if (this.state.localUrl) URL.revokeObjectURL(this.state.localUrl);
        this.state.localUrl = URL.createObjectURL(file);
        this.state.localName = file.name;
        this.renderLocal();
        this.loadMedia();
        this.renderOutput();
      } else if (target.dataset && target.dataset.b === 'cp-time') {
        this.sortCheckpoints();
        this.renderCheckpoints();
        this.renderOutput();
      } else if (target.dataset && target.dataset.b) {
        this.onInput(target);
      }
    });
    root.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && event.target.id === 'b-url') { event.preventDefault(); BuilderActions['b-load-url'](); }
    });
  }
};

const BuilderActions = {
  'b-back'() { Builder.close(); },
  'b-load-url'() {
    const s = Builder.state;
    if (s.localUrl) { URL.revokeObjectURL(s.localUrl); s.localUrl = null; s.localName = ''; }
    Builder.renderLocal();
    Builder.loadMedia();
    Builder.renderOutput();
  },
  'b-add-cp'() {
    const s = Builder.state;
    const time = Math.round(Builder.now() * 10) / 10;
    const added = { id: '', auto: false, time, question: '', options: ['', '', '', ''], correct: 0, hint: '' };
    s.lesson.checkpoints.push(added);
    Builder.sortCheckpoints();
    Builder.renderCheckpoints();
    Builder.renderOutput();
    const index = s.lesson.checkpoints.indexOf(added);
    const field = $(`#b-cps [data-b="cp-question"][data-i="${index}"]`);
    if (field) { field.focus(); field.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  },
  'b-cp-del'(button) {
    Builder.state.lesson.checkpoints.splice(Number(button.dataset.i), 1);
    Builder.renderCheckpoints();
    Builder.renderOutput();
  },
  'b-cp-now'(button) {
    const s = Builder.state;
    const cp = s.lesson.checkpoints[Number(button.dataset.i)];
    cp.auto = false;
    cp.time = Math.round(Builder.now() * 10) / 10;
    Builder.sortCheckpoints();
    Builder.renderCheckpoints();
    Builder.renderOutput();
  },
  'b-cp-go'(button) {
    const cp = Builder.state.lesson.checkpoints[Number(button.dataset.i)];
    if (!cp.auto) Builder.seek(Math.max(0, cp.time - 3), true);
  },
  'b-auto-all'() {
    Builder.state.lesson.checkpoints.forEach((cp) => { cp.auto = true; cp.time = null; });
    Builder.renderCheckpoints();
    Builder.renderOutput();
  },
  'b-opt-add'(button) {
    const cp = Builder.state.lesson.checkpoints[Number(button.dataset.i)];
    if (cp.options.length >= 6) return;
    cp.options.push('');
    Builder.renderCheckpoints();
    Builder.renderOutput();
    const field = $(`#b-cps [data-b="cp-option"][data-i="${button.dataset.i}"][data-k="${cp.options.length - 1}"]`);
    if (field) field.focus();
  },
  'b-opt-del'(button) {
    const cp = Builder.state.lesson.checkpoints[Number(button.dataset.i)];
    const k = Number(button.dataset.k);
    if (cp.options.length <= 2) return;
    cp.options.splice(k, 1);
    if (Number(cp.correct) === k) cp.correct = 0;
    else if (Number(cp.correct) > k) cp.correct = Number(cp.correct) - 1;
    Builder.renderCheckpoints();
    Builder.renderOutput();
  },
  'b-out'(button) {
    Builder.state.out = button.dataset.out;
    Builder.renderOutput();
  },
  async 'b-copy'(button) {
    Builder.renderOutput();
    const ok = await copyText($('#b-out').value);
    const label = button.querySelector('span');
    if (label) {
      label.textContent = ok ? 'Đã sao chép' : 'Chưa sao chép được';
      setTimeout(() => { if (label.isConnected) label.textContent = 'Sao chép'; }, 1800);
    }
  },
  // Áp cấu hình vừa soạn vào trang đang mở (chỉ trong phiên này) để học thử như học viên.
  'b-apply'() {
    const s = Builder.state;
    const lesson = Builder.buildLesson();
    if (s.extraError) {
      toast('Sửa lỗi JSON trước khi dùng thử', 'err');
      $('#b-extra').focus();
      return;
    }
    const config = Builder.buildConfig(lesson);
    APP_CONFIG.lessons = config.lessons.map(normalizeLesson);
    Player.setOverride(lesson.id, s.localUrl || null);
    Builder.stopMedia();
    App.show('app');
    ui.lessonId = null;
    App.openLesson(lesson.id, { force: true });
    App.setTab('video');
  }
};

/* ========================================================================== */
/* 13. KHỞI ĐỘNG                                                               */
/* ========================================================================== */
async function boot() {
  normalizeConfig();
  loadStore();
  Sound.init();
  AudioMap.load();
  Player.init();
  Builder.bind();
  bindGlobalEvents();
  ui.content = await loadContentFile();   // link video + mốc dừng từ file Excel cạnh trang (nếu có)
  $('#boot-wait').hidden = true;
  App.renderHeader();
  // Trình duyệt bên trong Zalo / Facebook / Messenger / Instagram / TikTok / Line: nhắc mở bằng trình duyệt thật.
  if (/Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|TikTok|musical_ly|Line\//i.test(navigator.userAgent)) {
    let seen = false;
    try { seen = sessionStorage.getItem('inapp-note') === '1'; } catch (err) { /* bỏ qua */ }
    if (!seen) $('#inapp-note').hidden = false;
  }

  // Quay lại tab / mở lại ứng dụng: hỏi lại máy chủ (cô vừa kích hoạt, vừa thêm bài, vừa gia hạn…).
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncAccount(60000); });
  window.addEventListener('focus', () => syncAccount(60000));
  // Đang chờ kích hoạt: cứ 3 phút hỏi lại một lần (chỉ khi đang mở trang).
  setInterval(() => { if (store.session && !store.session.active && document.visibilityState === 'visible') syncAccount(170000); }, 180000);

  const session = store.session;
  if (!session || !session.email || !session.token) {
    store.session = null;
    App.showGate();
    return;
  }
  // Đã đăng nhập từ trước: vào thẳng bài đang học, rồi hỏi lại máy chủ (đã kích hoạt chưa, còn hạn không, có tiến trình từ máy khác không).
  App.enter();
  syncAccount();
}
let syncAt = 0;
let syncBusy = false;
async function syncAccount(minGap = 0) {
  const session = store.session;
  if (!session || syncBusy || Date.now() - syncAt < minGap) return;
  syncBusy = true;
  syncAt = Date.now();
  const access = (x) => JSON.stringify([x.active, x.expired, x.maxLessons, x.expiresAt, x.role]);
  const before = access(session);
  const progressBefore = JSON.stringify(userProgress());
  try {
    const result = await Account.refresh();
    if (!store.session || store.session.email !== session.email) return;
    if (result.ok) {
      const now = store.session;
      if (access(now) !== before && ui.view === 'app') {
        const opened = !session.active && now.active;
        if (ui.testId && ui.test && ui.test.startedAt && !ui.test.submitted) App.renderHeader();   // đang làm bài kiểm tra: không làm gián đoạn
        else App.enter();
        if (opened) toast('Tài khoản đã được kích hoạt', 'ok', 5000);
      } else {
        App.renderHeader();
        if (ui.view === 'app' && JSON.stringify(userProgress()) !== progressBefore) { App.renderSidebar(); if (ui.lessonId) App.renderStepper(); }   // tiến trình từ thiết bị khác
      }
    } else if (result.reason === 'session') {
      App.sessionLost();
    }
  } finally {
    syncBusy = false;
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
