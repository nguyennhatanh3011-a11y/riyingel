/* Bố cục: máy tính = khung cố định 2 cột 70/30 (trái: trình phát → 5 bước → vùng luyện; phải: lộ trình); điện thoại = 1 cột cuộn dọc. */
@theme {
  --font-sans: "Be Vietnam Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-hanzi: "Kaiti SC", "STKaiti", "KaiTi", "KaiTi_GB2312", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --font-pinyin: "Segoe UI", Roboto, "SF Pro Text", "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  --color-paper: #f2f4f9;      /* nền trang: giấy trắng ngả lam */
  --color-surface: #ffffff;    /* thẻ, bảng */
  --color-ink: #16203a;        /* chữ chính: mực chàm */
  --color-ink-2: #55607a;      /* chữ phụ */
  --color-ink-3: #8a93a8;      /* chữ mờ, viền ô */
  --color-line: #dde3ee;       /* đường kẻ */
  --color-brand: #1f47b4;      /* lam cô-ban gốm Thanh Hoa */
  --color-brand-dark: #17378f;
  --color-brand-soft: #e9effc;
  --color-stage: #0e1630;      /* nền trình phát */
  --color-stage-2: #1b2750;
  --color-seal: #b3261e;       /* son đỏ con dấu (chỉ dùng cho logo) */
  --color-gold: #a16207;       /* khóa theo gói */

  --animate-shake: shake .32s ease-in-out;
  --animate-pop: pop .45s cubic-bezier(.2, 1.4, .4, 1);
  --animate-rise: rise .22s ease-out;
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  @keyframes rise { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
}

@layer base {
  html, body { height: 100%; }
  body { background: var(--color-paper); color: var(--color-ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button:not(:disabled), [role="button"], label[for], summary { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }
  ::selection { background: var(--color-brand-soft); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
}

@layer components {
  .ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .hz { font-family: var(--font-hanzi); }
  .py { font-family: var(--font-pinyin); }

  /* Con dấu logo */
  .seal { display: inline-grid; place-items: center; flex: none; background: var(--color-seal); color: #fff; font-family: var(--font-hanzi); font-weight: 600; line-height: 1; border-radius: 22%; box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .28); }

  /* Ô tập viết 田字格: khung vuông + hai đường gióng nét đứt */
  .tian {
    --g: var(--color-line);
    display: grid; place-items: center; aspect-ratio: 1; line-height: 1; font-family: var(--font-hanzi);
    border: 1.5px solid var(--color-ink-3); border-radius: 12%;
    background:
      repeating-linear-gradient(90deg, var(--g) 0 5px, transparent 5px 10px) center / 100% 1.5px no-repeat,
      repeating-linear-gradient(0deg, var(--g) 0 5px, transparent 5px 10px) center / 1.5px 100% no-repeat,
      var(--color-surface);
  }
  .tian-dark { --g: #3a4f9c; border-color: #4f6bd0; background-color: #131d3d; color: #fff; }

  /* Thẻ lật */
  .flip { perspective: 1200px; }
  .flip-inner { position: relative; width: 100%; height: 100%; transition: transform .45s cubic-bezier(.3, .7, .2, 1); transform-style: preserve-3d; }
  .flip[data-flipped="true"] .flip-inner { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip-back { transform: rotateY(180deg); }

  /* Thanh tua */
  .seek { position: relative; height: 22px; display: flex; align-items: center; touch-action: none; }
  .seek-track { position: relative; width: 100%; height: 5px; border-radius: 999px; background: rgb(255 255 255 / .16); }
  .seek-watched, .seek-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
  .seek-watched { background: rgb(255 255 255 / .34); }
  .seek-fill { background: #7ea2ff; }
  .seek-knob { position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .4); }
  .seek-mark { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; border: 2px solid var(--color-stage); background: #fbbf24; }
  .seek-mark[data-done="true"] { background: #34d399; }

  /* Sóng âm cho bài dạng âm thanh */
  .eq { display: flex; align-items: flex-end; gap: 4px; height: 26px; }
  .eq i { display: block; width: 4px; height: 100%; border-radius: 2px; background: #7ea2ff; transform-origin: bottom; transform: scaleY(.22); }
  .eq[data-on="true"] i { animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.25s; } .eq i:nth-child(3) { animation-delay: -.5s; } .eq i:nth-child(4) { animation-delay: -.12s; } .eq i:nth-child(5) { animation-delay: -.38s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.22); } 50% { transform: scaleY(1); } }

  .spin { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pulse-ring { animation: pulse-ring 1.2s ease-out infinite; }
  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgb(225 29 72 / .45); } 100% { box-shadow: 0 0 0 12px rgb(225 29 72 / 0); } }

  .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--color-line) transparent; }
}
